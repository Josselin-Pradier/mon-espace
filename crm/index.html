      + fld("Mission", '<input id="m_mcmission" value="' + esc(mc0 ? mc0.mission || "" : "") + '" placeholder="Ex. Étude du refuge, atelier pédagogique…"/>')
      + '</div></div>'
      + '<div class="modal-foot"><button type="button" class="btn" data-act="close-modal">Annuler</button>'
      + '<button type="submit" class="btn primary">' + (mc0 ? "Enregistrer" : "Ajouter") + '</button></div></form>';
  }

  if (m.type === "contrib") {
    var pjC = m.projetId && org ? findProjet(org, m.projetId) : null;
    title = pjC ? "Ajouter un établissement co-financeur" : "Co-financement";
    var cOpts = state.orgs.filter(function (o2) {
      return o2.id !== (org ? org.id : "") && !(pjC && (pjC.contributeurs || []).indexOf(o2.id) >= 0);
    }).map(function (o2) {
      return '<option value="' + o2.id + '">' + esc(o2.nom) + '</option>';
    }).join("");
    body = pjC && cOpts
      ? '<form id="modal-form"><div class="form-grid">'
        + '<div class="full">' + fld("Établissement *", '<select id="m_corg" required>' + cOpts + '</select>') + '</div>'
        + '</div><p style="font-size:11.5px;color:#64748b;margin:10px 0 0">L&#39;établissement sélectionné apparaîtra comme co-financeur du projet « ' + esc(pjC.nom || "Projet") + ' ». Son apport se précise ligne par ligne dans la carte Financement (champ « Établissement mécène »).</p>'
        + '<div class="modal-foot"><button type="button" class="btn" data-act="close-modal">Annuler</button>'
        + '<button type="submit" class="btn primary">Ajouter</button></div></form>'
      : '<p style="font-size:13px;color:#94a3b8">Tous les autres établissements participent déjà à ce projet.</p>'
        + '<div class="modal-foot"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>';
  }

  if (m.type === "export") {
    title = "Exporter les données";
    body = '<div>'
      + '<p style="margin:0 0 14px;font-size:13px;color:#64748b">Choisissez le format d&#39;export. Le fichier est téléchargé par votre navigateur.</p>'
      + '<div style="display:flex;flex-direction:column;gap:8px">'
      + '<button class="btn" data-act="export-json">📦 Sauvegarde JSON (réimportable)</button>'
      + '<button class="btn" data-act="export-html">🌐 Version HTML tout-en-un (données embarquées)</button>'
      + '<button class="btn" data-act="export-csv-orgs">📊 CSV — Établissements</button>'
      + '<button class="btn" data-act="export-csv-projets">📁 CSV — Projets</button>'
      + '<button class="btn" data-act="export-csv-contacts">👤 CSV — Contacts</button>'
      + '<button class="btn" data-act="export-csv-alertes">🔔 CSV — Alertes</button>'
      + '</div>'
      + '<p style="font-size:11.5px;color:#94a3b8;margin:12px 0 0">CSV : séparateur « ; » et encodage UTF-8 (BOM), s&#39;ouvre directement dans Excel. HTML tout-en-un : copiez le fichier sur une clé USB ou envoyez-le par mail, il rouvre vos fiches à l&#39;identique sur n&#39;importe quel PC.</p>'
      + '<div class="modal-foot"><button type="button" class="btn" data-act="close-modal">Fermer</button></div>'
      + '</div>';
  }

  if (m.type === "statuts") {
    title = "Éditer les statuts";
    var rows = state.statuts.map(function (s, i) {
      var used = state.orgs.filter(function (o) { return o.statut === s.value; }).length;
      return '<div class="statut-edit-row">'
        + '<input id="st_lbl_' + i + '" value="' + esc(s.label) + '"/>'
        + '<select id="st_col_' + i + '">' + Object.keys(PALETTE).map(function (k) { return '<option value="' + k + '"' + (s.color === k ? " selected" : "") + '>' + PALETTE[k].label + '</option>'; }).join("") + '</select>'
        + '<button type="button" class="btn sm danger" data-act="del-statut" data-id="' + esc(s.value) + '" title="' + used + ' fiche(s) utilisent ce statut">Suppr.</button>'
        + '</div>';
    }).join("");
    body = '<form id="modal-form">'
      + '<p style="margin:0 0 12px;font-size:12px;color:#64748b">Renomme, change la couleur, ajoute ou supprime des statuts. Un statut utilisé par une fiche apparaîtra comme inconnu si vous le supprimez.</p>'
      + rows
      + '<button type="button" class="btn sm" data-act="add-statut">＋ Ajouter un statut</button>'
      + '<div class="modal-foot"><button type="button" class="btn" data-act="close-modal">Annuler</button>'
      + '<button type="submit" class="btn primary">Enregistrer</button></div></form>';
  }

  return '<div class="overlay" data-overlay="1"><div class="modal">'
    + '<div class="modal-head"><h2>' + esc(title) + '</h2>'
    + '<button class="btn sm" data-act="close-modal" style="border:0;font-size:16px">✕</button></div>'
    + '<div class="modal-body">' + body + '</div></div></div>';
}

/* ===================== Rendu ===================== */

function render() {
  navSync();
  var app = document.getElementById("app");
  var alerts = collectAlerts(state.orgs);
  var pendingCount = alerts.filter(function (a) { return !a.faite; }).length;
  var projCount = allProjets().length;
  var aapCount = allProjets().filter(function (it) { return projAap(it.projet); }).length;

  var navBtn = function (target, label, icon, badge) {
    return '<button class="nav-btn' + (state.page === target ? " active" : "") + '" data-act="goto" data-page="' + target + '">'
      + icon + " " + label
      + (badge !== undefined && badge > 0 ? ' <span class="count">' + badge + '</span>' : "")
      + '</button>';
  };

  var content = state.page === "dash" ? viewDashboard()
    : state.page === "orgs" ? viewOrgs()
    : state.page === "projets" ? viewProjets()
    : state.page === "projet" ? viewProjet()
    : state.page === "aap" ? viewAap()
    : state.page === "agenda" ? viewAgenda()
    : state.page === "alerts" ? viewAlerts()
    : state.page === "stats" ? viewStats()
    : viewDetail();

  app.innerHTML = ''
    + '<header class="top"><div class="wrap topbar">'
    + '<div class="brand"><div class="logo">🌿</div><div><h1>CRM Mécénat</h1><p>Établissements, projets &amp; appels à projets</p></div></div>'
    + '<nav class="tabs">'
    + navBtn("dash", "Tableau de bord", "▦")
    + navBtn("orgs", "Établissements", "🏢", state.orgs.length)
    + navBtn("projets", "Projets", "📁", projCount)
    + navBtn("aap", "AAP", "📢", aapCount)
    + navBtn("agenda", "Agenda", "📅", alerts.filter(function (a) { return !a.faite && a.date && daysUntil(a.date) < 0; }).length)
    + navBtn("alerts", "Alertes", "🔔", pendingCount)
    + navBtn("stats", "Stats", "📊")
    + '</nav>'
    + '<div class="actions">'
    + '<button class="btn sm" data-act="nav-back" title="Reculer (page précédente)"' + (nav.index > 0 ? "" : " disabled") + '>←</button>'
    + '<button class="btn sm" data-act="nav-fwd" title="Avancer (page suivante)"' + (nav.index < nav.stack.length - 1 ? "" : " disabled") + '>→</button>'
    + '<button class="btn sm" data-act="edit-statuts" title="Éditer les statuts">⚙ Statuts</button>'
    + '<button class="btn sm" data-act="export">⬇ Export</button>'
    + '<button class="btn sm" data-act="print" title="Imprimer / PDF">🖨 Imprimer</button>'
    + '<button class="btn sm" data-act="import">⬆ Import</button>'
    + '<button class="btn sm" data-act="reset-seed">Exemples</button>'
    + '<input type="file" id="file-import" accept="application/json" style="display:none"/>'
    + '</div>'
    + '</div></header>'
    + '<main class="wrap">' + content + '</main>'
    + viewModal()
    + '<footer class="foot wrap">CRM Mécénat LPO · <b>v3</b> — les données sont enregistrées dans ce navigateur. Pensez à exporter régulièrement : bouton Export (sauvegarde JSON, CSV ou HTML tout-en-un) · bouton 🖨 Imprimer pour une version papier / PDF pour les réunions.</footer>';

  if (state.focusSearch) {
    var s = document.getElementById("search");
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    state.focusSearch = false;
  }
}

/* ===================== Actions ===================== */

function readStatutsDraft() {
  state.statuts.forEach(function (s, i) {
    var lbl = document.getElementById("st_lbl_" + i);
    var col = document.getElementById("st_col_" + i);
    if (lbl) s.label = lbl.value;
    if (col) s.color = col.value;
  });
}

document.addEventListener("click", function (e) {
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  var orgId = el.getAttribute("data-org");
  var id = el.getAttribute("data-id");

  if (act === "goto") setState({ page: el.getAttribute("data-page"), detailId: null, projetId: null });
  else if (act === "goto-filtered") { state.fStatut = el.getAttribute("data-statut"); setState({ page: "orgs", detailId: null, projetId: null, fStatut: el.getAttribute("data-statut") }); }
  else if (act === "open-org") setState({ page: "detail", detailId: id, projetId: null });
  else if (act === "open-projet") setState({ page: "projet", detailId: orgId, projetId: id });
  else if (act === "close-modal") closeModal();
  else if (act === "nav-back") {
    if (nav.index > 0) { nav.index--; var nb = nav.stack[nav.index]; setState({ page: nb.page, detailId: nb.detailId, projetId: nb.projetId }); }
  }
  else if (act === "nav-fwd") {
    if (nav.index < nav.stack.length - 1) { nav.index++; var nf = nav.stack[nav.index]; setState({ page: nf.page, detailId: nf.detailId, projetId: nf.projetId }); }
  }
  else if (act === "new-org") setState({ modal: { type: "org" } });
  else if (act === "qstatut") setState({ modal: { type: "qstatut", orgId: orgId } });
  else if (act === "qprojstatut") setState({ modal: { type: "qprojstatut", orgId: orgId, projetId: id } });
  else if (act === "edit-org") setState({ modal: { type: "org", orgId: id } });
  else if (act === "delete-org") {
    var o = findOrg(id);
    if (o && confirm('Supprimer définitivement la fiche « ' + o.nom + ' » ?')) {
      state.orgs = state.orgs.filter(function (x) { return x.id !== id; });
      state.orgs.forEach(function (x) {
        (x.projets || []).forEach(function (p) {
          if (p.contributeurs) p.contributeurs = p.contributeurs.filter(function (c) { return c !== id; });
          ((p.financement || {}).lignes || []).forEach(function (l) { if (l.orgId === id) l.orgId = ""; });
        });
      });
      persist(); setState({ page: "orgs", detailId: null });
    }
  }
  else if (act === "new-contact") setState({ modal: { type: "contact", orgId: orgId } });
  else if (act === "edit-contact") setState({ modal: { type: "contact", orgId: orgId, contactId: id } });
  else if (act === "view-contact") setState({ modal: { type: "contact-view", orgId: orgId, contactId: id } });
  else if (act === "delete-contact") {
    if (confirm("Supprimer ce contact ?")) { updateOrg(orgId, function (o) { o.contacts = o.contacts.filter(function (c) { return c.id !== id; }); return o; }); render(); }
  }
  else if (act === "new-histo") setState({ modal: { type: "histo", orgId: orgId, projetId: el.getAttribute("data-projet") || null } });
  else if (act === "edit-histo") setState({ modal: { type: "histo", orgId: orgId, hId: id } });
  else if (act === "delete-histo") {
    if (confirm("Supprimer cet échange ?")) { updateOrg(orgId, function (o) { o.historique = o.historique.filter(function (h) { return h.id !== id; }); return o; }); render(); }
  }
  else if (act === "new-alert") setState({ modal: { type: "alert", orgId: orgId } });
  else if (act === "new-alert-any") setState({ modal: { type: "alert", orgId: null } });
  else if (act === "new-alert-deadline") {
    var o2 = findOrg(orgId);
    var pj2 = findProjet(o2, el.getAttribute("data-projet"));
    var aapD = pj2 && pj2.aap;
    setState({
      modal: {
        type: "alert", orgId: orgId, presetType: "deadline-aap",
        presetDate: aapD ? aapD.deadline : today(),
        presetLibelle: "Préparer le dépôt AAP : " + (aapD ? aapD.nom || pj2.nom : "")
      }
    });
  }
  else if (act === "toggle-alert") { updateOrg(orgId, function (o) { o.alertes = o.alertes.map(function (a) { return a.id === id ? Object.assign({}, a, { faite: !a.faite }) : a; }); return o; }); render(); }
  else if (act === "delete-alert") {
    if (confirm("Supprimer cette alerte ?")) { updateOrg(orgId, function (o) { o.alertes = o.alertes.filter(function (a) { return a.id !== id; }); return o; }); render(); }
  }
  else if (act === "new-projet") setState({ modal: { type: "projet", orgId: orgId || null } });
  else if (act === "edit-projet") setState({ modal: { type: "projet", orgId: orgId, projetId: id } });
  else if (act === "delete-projet") {
    var orgP = findOrg(orgId);
    var pjD = findProjet(orgP, id);
    if (pjD && confirm('Supprimer le projet « ' + (pjD.nom || "sans nom") + ' » ?')) {
      updateOrg(orgId, function (o) { o.projets = (o.projets || []).filter(function (p) { return p.id !== id; }); return o; });
      setState({ page: "detail", detailId: orgId, projetId: null });
    }
  }
  else if (act === "new-aap") setState({ modal: { type: "aap", orgId: orgId || null, projetId: el.getAttribute("data-projet") || null } });
  else if (act === "edit-aap") setState({ modal: { type: "aap", orgId: orgId, projetId: el.getAttribute("data-projet") } });
  else if (act === "new-ligne") setState({ modal: { type: "ligne", orgId: orgId, projetId: el.getAttribute("data-projet") } });
  else if (act === "edit-ligne") setState({ modal: { type: "ligne", orgId: orgId, projetId: el.getAttribute("data-projet"), ligneId: id } });
  else if (act === "delete-ligne") {
    if (confirm("Supprimer cette ligne de financement ?")) { updateOrg(orgId, function (o) {
      var p = findProjet(o, el.getAttribute("data-projet"));
      if (p) { p.financement = p.financement || { lignes: [] }; p.financement.lignes = (p.financement.lignes || []).filter(function (l) { return l.id !== id; }); }
      return o;
    }); render(); }
  }
  else if (act === "new-mecenat") setState({ modal: { type: "mecenat", orgId: orgId } });
  else if (act === "edit-mecenat") setState({ modal: { type: "mecenat", orgId: orgId, mecId: id } });
  else if (act === "delete-mecenat") {
    if (confirm("Supprimer ce mécénat ?")) { updateOrg(orgId, function (o) { o.mecenats = (o.mecenats || []).filter(function (mc) { return mc.id !== id; }); return o; }); render(); }
  }
  else if (act === "edit-alert") setState({ modal: { type: "alert", orgId: orgId, alertId: id } });
  else if (act === "edit-statuts") setState({ modal: { type: "statuts" } });
  else if (act === "add-statut") {
    readStatutsDraft();
    state.statuts.push({ value: "st-" + uid(), label: "Nouveau statut", color: "gray" });
    persist(); render();
  }
  else if (act === "del-statut") {
    readStatutsDraft();
    state.statuts = state.statuts.filter(function (s) { return s.value !== id; });
    persist(); render();
  }
  else if (act === "new-contrib") setState({ modal: { type: "contrib", orgId: orgId, projetId: id } });
  else if (act === "remove-contrib") {
    var cid = el.getAttribute("data-cid");
    updateOrg(orgId, function (o) {
      var p = findProjet(o, id);
      if (p && p.contributeurs) p.contributeurs = p.contributeurs.filter(function (x) { return x !== cid; });
      return o;
    });
    render();
  }
  else if (act === "export") setState({ modal: { type: "export" } });
  else if (act === "export-json") {
    var payload = { version: 3, orgs: state.orgs, statuts: state.statuts };
    downloadText("crm-mecenat-lpo-" + today() + ".json", JSON.stringify(payload, null, 2), "application/json", false);
    closeModal();
  }
  else if (act === "export-html") {
    var clone = document.documentElement.cloneNode(true);
    var appC = clone.querySelector("#app"); if (appC) appC.innerHTML = "";
    var paC = clone.querySelector("#print-area"); if (paC) paC.innerHTML = "";
    var htmlOut = "<!doctype html>\n" + clone.outerHTML;
    var inject = '<scr' + 'ipt>window.__CRM_EMBEDDED_DATA__ = ' + JSON.stringify({ version: 3, orgs: state.orgs, statuts: state.statuts }).replace(/<\//g, "<\\/") + ';</scr' + 'ipt>';
    var openTag = "<scr" + "ipt>";
    htmlOut = htmlOut.replace(openTag, function () { return inject + openTag; });
    downloadText("crm-mecenat-lpo-" + today() + ".html", htmlOut, "text/html", false);
    closeModal();
  }
  else if (act === "export-csv-orgs") {
    var rows = [["Nom", "Type", "Secteur", "Région", "Statut", "Site web", "Montant potentiel", "Refuge", "Projets", "Contacts", "Échanges", "Mécénat valorisé €", "Notes"]];
    state.orgs.forEach(function (o) {
      rows.push([o.nom, orgTypeInfo(o.type).label, o.secteur || "", o.region || "", statutInfo(o.statut).label, o.siteWeb || "", o.montantPotentiel || "", o.refugeLPO ? "Oui" + (o.refugeDetails ? " — " + o.refugeDetails : "") : "Non", (o.projets || []).length, (o.contacts || []).length, (o.historique || []).length, (o.mecenats || []).reduce(function (s, mc) { return s + num(mc.montant); }, 0), o.notes || ""]);
    });
    downloadText("etablissements-" + today() + ".csv", toCSV(rows), "text/csv", true);
    closeModal();
  }
  else if (act === "export-csv-projets") {
    var rowsP = [["Projet", "Porteur", "Co-financeurs", "Statut", "Coût €", "Financé €", "Reste €", "Année", "AAP", "Deadline AAP", "Description"]];
    allProjets().forEach(function (it) {
      var p = it.projet;
      var aap = projAap(p);
      var cos = (p.contributeurs || []).map(function (cid) { var co = findOrg(cid); return co ? co.nom : ""; }).filter(Boolean).join(" / ");
      rowsP.push([p.nom || "Projet", it.orgNom, cos, projStatutInfo(p.statut).label, num(p.cout), finTotal(p), Math.max(0, finReste(p)), p.annee || "", aap ? aap.nom || "Oui" : "Non", aap ? aap.deadline || "" : "", p.description || ""]);
    });
    downloadText("projets-" + today() + ".csv", toCSV(rowsP), "text/csv", true);
    closeModal();
  }
  else if (act === "export-csv-contacts") {
    var rowsC = [["Nom", "Fonction", "Email", "Téléphone", "Principal", "Établissement", "Statut"]];
    state.orgs.forEach(function (o) {
      (o.contacts || []).forEach(function (c) {
        rowsC.push([c.nom, c.fonction || "", c.email || "", c.tel || "", c.principal ? "Oui" : "Non", o.nom, statutInfo(o.statut).label]);
      });
    });
    downloadText("contacts-" + today() + ".csv", toCSV(rowsC), "text/csv", true);
    closeModal();
  }
  else if (act === "export-csv-alertes") {
    var rowsA = [["Libellé", "Type", "Échéance", "Notes", "Faite", "Établissement"]];
    collectAlerts(state.orgs).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (a) {
      rowsA.push([a.libelle, alerteTypeInfo(a.type).label, a.date, a.notes || "", a.faite ? "Oui" : "Non", a.orgNom]);
    });
    downloadText("alertes-" + today() + ".csv", toCSV(rowsA), "text/csv", true);
    closeModal();
  }
  else if (act === "print") {
    var pa = document.getElementById("print-area");
    if (!pa) return;
    var alertsAll = collectAlerts(state.orgs);
    var pendingA = alertsAll.filter(function (a) { return !a.faite; });
    var pjItems = allProjets();
    var resteActifs = 0;
    pjItems.forEach(function (it) { if (projetActif(it.projet)) resteActifs += Math.max(0, finReste(it.projet)); });
    var pjRows = pjItems.map(function (it) {
      var p = it.projet;
      var aap = projAap(p);
      return '<tr><td>' + esc(p.nom || "Projet") + '</td><td>' + esc(it.orgNom) + (((p.contributeurs || []).length > 0) ? " +" + p.contributeurs.length : "") + '</td><td>' + projStatutInfo(p.statut).label + '</td><td>' + (num(p.cout) > 0 ? fmtE(num(p.cout)) : "—") + '</td><td>' + (finTotal(p) > 0 ? fmtE(finTotal(p)) : "—") + '</td><td>' + (num(p.cout) > 0 ? fmtE(Math.max(0, finReste(p))) : "—") + '</td><td>' + (aap ? esc(aap.nom || "AAP") + (aap.deadline ? " — " + esc(formatDate(aap.deadline)) : "") : "—") + '</td></tr>';
    }).join("");
    var orgRows = state.orgs.map(function (o) {
      var cp = (o.contacts || []).filter(function (c) { return c.principal; })[0] || (o.contacts || [])[0];
      return '<tr><td>' + esc(o.nom) + '</td><td>' + orgTypeInfo(o.type).label + '</td><td>' + statutInfo(o.statut).label + '</td><td>' + esc(cp ? cp.nom + (cp.fonction ? " (" + cp.fonction + ")" : "") : "—") + '</td><td>' + (o.projets || []).length + '</td></tr>';
    }).join("");
    var alertRows = pendingA.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).map(function (a) {
      return '<tr><td>' + esc(formatDate(a.date)) + '</td><td>' + esc(a.libelle) + '</td><td>' + esc(a.orgNom) + '</td></tr>';
    }).join("");
    pa.innerHTML = '<h1>CRM Mécénat — LPO</h1>'
      + '<p class="p-sub">Édité le ' + esc(formatDate(today())) + ' · ' + state.orgs.length + ' établissement(s), ' + pjItems.length + ' projet(s)</p>'
      + '<div class="p-kpis">'
      + '<div><b>' + state.orgs.length + '</b>Établissements</div>'
      + '<div><b>' + pjItems.length + '</b>Projets</div>'
      + '<div><b>' + pendingA.length + '</b>Alertes en cours</div>'
      + '<div><b>' + fmtE(resteActifs) + '</b>Reste à financer (projets actifs)</div>'
      + '</div>'
      + '<h2>Projets</h2>'
      + '<table class="p-table"><thead><tr><th>Projet</th><th>Porteur</th><th>Statut</th><th>Coût</th><th>Financé</th><th>Reste</th><th>AAP</th></tr></thead><tbody>' + pjRows + '</tbody></table>'
      + '<h2>Établissements</h2>'
      + '<table class="p-table"><thead><tr><th>Nom</th><th>Type</th><th>Statut</th><th>Contact principal</th><th>Projets</th></tr></thead><tbody>' + orgRows + '</tbody></table>'
      + '<h2>Alertes en cours (' + pendingA.length + ')</h2>'
      + (alertRows ? '<table class="p-table"><thead><tr><th>Échéance</th><th>Libellé</th><th>Établissement</th></tr></thead><tbody>' + alertRows + '</tbody></table>' : '<p class="p-sub">Aucune alerte en attente.</p>');
    window.print();
  }
  else if (act === "import") { var fi = document.getElementById("file-import"); if (fi) fi.click(); }
  else if (act === "reset-seed") {
    if (confirm("Remplacer toutes les données par les fiches d'exemple ?")) {
      state.orgs = JSON.parse(JSON.stringify(SEED)).map(migrateOrg);
      state.statuts = JSON.parse(JSON.stringify(DEFAULT_STATUTS));
      persist(); setState({ page: "dash", detailId: null });
    }
  }
});

document.addEventListener("input", function (e) {
  if (e.target.id === "search") {
    state.query = e.target.value;
    state.focusSearch = true;
    render();
  }
});

document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "m_lsrcsel") {
    var srcInp = document.getElementById("m_lsrc");
    if (srcInp) {
      if (t.value === "__custom") { srcInp.focus(); srcInp.select(); }
      else srcInp.value = t.value;
    }
    return;
  }
  var toggle = t.getAttribute && t.getAttribute("data-toggle");
  if (toggle) {
    var wrap = document.getElementById(toggle);
    if (wrap) wrap.style.display = t.checked ? "" : "none";
    return;
  }
  var f = t.getAttribute && t.getAttribute("data-filter");
  if (!f) return;
  var patch = {};
  patch[f] = t.type === "checkbox" ? t.checked : t.value;
  patch.focusSearch = false;
  setState(patch);
});

document.addEventListener("change", function (e) {
  if (e.target.id === "file-import") {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (Array.isArray(data)) {
          /* ancien format v1 : simple liste de fiches */
          state.orgs = data.map(migrateOrg);
          persist();
          setState({ page: "dash", detailId: null, projetId: null });
        } else if (data && Array.isArray(data.orgs)) {
          state.orgs = data.orgs.map(migrateOrg);
          if (Array.isArray(data.statuts) && data.statuts.length) state.statuts = data.statuts;
          persist();
          setState({ page: "dash", detailId: null, projetId: null });
        } else {
          alert("Fichier invalide : données non reconnues.");
        }
      } catch (err) { alert("Impossible de lire ce fichier JSON."); }
    };
    reader.readAsText(f);
    e.target.value = "";
  }
});

document.addEventListener("submit", function (e) {
  if (e.target.id !== "modal-form") return;
  e.preventDefault();
  var m = state.modal;
  if (!m) return;
  var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ""; };
  var chk = function (id) { var el = document.getElementById(id); return el ? el.checked : false; };

  if (m.type === "qstatut") {
    updateOrg(m.orgId, function (o) { o.statut = v("m_qstatut") || o.statut; return o; });
    setState({ modal: null });
  }
  else if (m.type === "qprojstatut") {
    updateOrg(m.orgId, function (o) { var pp = findProjet(o, m.projetId); if (pp) pp.statut = v("m_qpstatut") || pp.statut; return o; });
    setState({ modal: null });
  }
  else if (m.type === "org") {
    var existing = m.orgId ? findOrg(m.orgId) : null;
    var o = existing || { id: uid(), contacts: [], historique: [], alertes: [] };
    o.nom = v("m_nom");
    o.type = v("m_type");
    o.secteur = v("m_secteur");
    o.region = v("m_region");
    o.siteWeb = v("m_siteWeb");
    o.statut = v("m_statut");
    o.montantPotentiel = v("m_montant");
    o.refugeLPO = chk("m_refugeLPO");
    o.refugeDetails = o.refugeLPO ? v("m_refugeDetails") : "";
    o.mecenats = o.mecenats || [];
    o.projets = o.projets || [];
    o.notes = v("m_notes");
    if (!existing) {
      state.orgs = [o].concat(state.orgs);
      persist();
      setState({ modal: null, page: "detail", detailId: o.id });
    } else {
      persist();
      setState({ modal: null });
    }
  }

  else if (m.type === "contact") {
    if (!findOrg(m.orgId)) return;
    var c = { id: m.contactId || uid(), nom: v("m_cnom"), fonction: v("m_cfct"), email: v("m_cmail"), tel: v("m_ctel"), principal: chk("m_cprincipal") };
    updateOrg(m.orgId, function (o) {
      var exists = (o.contacts || []).some(function (x) { return x.id === c.id; });
      o.contacts = exists ? o.contacts.map(function (x) { return x.id === c.id ? c : x; }) : (o.contacts || []).concat([c]);
      if (c.principal) o.contacts = o.contacts.map(function (x) { return Object.assign({}, x, { principal: x.id === c.id }); });
      return o;
    });
    setState({ modal: null });
  }

  else if (m.type === "histo") {
    var hData = { id: m.hId || uid(), date: v("m_hdate"), type: v("m_htype"), contact: v("m_hcontact"), resume: v("m_hresume"), projetId: v("m_hprojet") };
    if (m.hId) {
      updateOrg(m.orgId, function (o) {
        o.historique = (o.historique || []).map(function (h) { return h.id === m.hId ? hData : h; });
        return o;
      });
    } else {
      updateOrg(m.orgId, function (o) { o.historique = [hData].concat(o.historique || []); return o; });
    }
    setState({ modal: null });
  }

  else if (m.type === "alert") {
    var aData = { libelle: v("m_alib"), type: v("m_atype"), date: v("m_adate"), notes: v("m_anotes") };
    var alOrgId = m.orgId || v("m_alorg") || "";
    if (!alOrgId) { setState({ modal: null }); return; }
    if (m.alertId) {
      updateOrg(alOrgId, function (o) {
        o.alertes = (o.alertes || []).map(function (a) { return a.id === m.alertId ? Object.assign({}, a, aData) : a; });
        return o;
      });
    } else {
      updateOrg(alOrgId, function (o) { o.alertes = (o.alertes || []).concat([Object.assign({ id: uid(), faite: false }, aData)]); return o; });
    }
    if (!m.orgId) setState({ modal: null, page: "agenda", detailId: null, projetId: null });
    else setState({ modal: null });
  }

  else if (m.type === "mecenat") {
    var mcData = { type: v("m_mctype"), montant: num(v("m_mcmontant")), description: v("m_mcdesc"), poste: v("m_mcposte"), personnel: v("m_mcperso"), mission: v("m_mcmission") };
    updateOrg(m.orgId, function (o) {
      o.mecenats = o.mecenats || [];
      if (m.mecId) {
        o.mecenats = o.mecenats.map(function (mc) { return mc.id === m.mecId ? Object.assign({}, mc, mcData) : mc; });
      } else {
        o.mecenats = o.mecenats.concat([Object.assign({ id: uid() }, mcData)]);
      }
      return o;
    });
    setState({ modal: null });
  }

  else if (m.type === "aap") {
    var tOrg = m.orgId, tPj = m.projetId;
    if (!tOrg || !tPj) {
      var parts = v("m_aapPj").split("|");
      tOrg = parts[0];
      tPj = parts[1];
    }
    if (!tOrg || !tPj) { alert("Choisissez un projet pour cet AAP."); return; }
    updateOrg(tOrg, function (o) {
      var p = findProjet(o, tPj);
      if (p) p.aap = { existant: true, nom: v("m_aapNom"), deadline: v("m_aapDeadline"), montant: v("m_aapMontant"), lien: v("m_aapLien") };
      return o;
    });
    setState({ modal: null });
  }

  else if (m.type === "projet") {
    var pjOrgId = m.orgId || v("m_pjorg");
    if (!pjOrgId || !findOrg(pjOrgId)) { alert("Choisissez un établissement pour ce projet."); return; }
    var aapEx = chk("m_aapExistant");
    var pjData = {
      nom: v("m_pjnom"),
      statut: v("m_pjstatut"),
      cout: num(v("m_pjcout")),
      annee: v("m_pjannee"),
      description: v("m_pjdesc"),
      financement: { lignes: [] },
      aap: { existant: aapEx, nom: aapEx ? v("m_aapNom") : "", deadline: aapEx ? v("m_aapDeadline") : "", montant: aapEx ? v("m_aapMontant") : "", lien: aapEx ? v("m_aapLien") : "" }
    };
    updateOrg(pjOrgId, function (o) {
      o.projets = o.projets || [];
      if (m.projetId) {
        var oldPj = findProjet(o, m.projetId);
        pjData.financement = oldPj ? oldPj.financement || { lignes: [] } : { lignes: [] };
        o.projets = o.projets.map(function (p) { return p.id === m.projetId ? Object.assign({}, p, pjData) : p; });
      } else {
        o.projets = o.projets.concat([Object.assign({ id: uid(), contributeurs: [] }, pjData)]);
      }
      return o;
    });
    setState({ modal: null });
  }

  else if (m.type === "ligne") {
    var src = v("m_lsrc"), mnt = num(v("m_lmnt"));
    updateOrg(m.orgId, function (o) {
      var p = findProjet(o, m.projetId);
      if (!p) return o;
      p.financement = p.financement || { lignes: [] };
      p.financement.lignes = p.financement.lignes || [];
      if (m.ligneId) {
        p.financement.lignes = p.financement.lignes.map(function (l) { return l.id === m.ligneId ? { id: l.id, source: src, montant: mnt, orgId: v("m_lorg") } : l; });
      } else {
        p.financement.lignes = p.financement.lignes.concat([{ id: uid(), source: src, montant: mnt, orgId: v("m_lorg") }]);
      }
      return o;
    });
    setState({ modal: null });
  }

  else if (m.type === "contrib") {
    var cidS = v("m_corg");
    if (!cidS || !findOrg(cidS)) return;
    updateOrg(m.orgId, function (o) {
      var p = findProjet(o, m.projetId);
      if (p) {
        p.contributeurs = p.contributeurs || [];
        if (p.contributeurs.indexOf(cidS) < 0 && cidS !== o.id) p.contributeurs.push(cidS);
      }
      return o;
    });
    setState({ modal: null });
  }

  else if (m.type === "statuts") {
    readStatutsDraft();
    persist();
    setState({ modal: null });
  }
});

/* ===================== Édition en direct (notes / description) ===================== */
document.addEventListener("focus", function (e) {
  var el = e.target.closest ? e.target.closest("[data-live]") : null;
  if (!el || el.getAttribute("data-ph") !== "1") return;
  el.innerHTML = "";
  el.removeAttribute("data-ph");
}, true);
document.addEventListener("blur", function (e) {
  var el = e.target.closest ? e.target.closest("[data-live]") : null;
  if (!el) return;
  var txt = el.innerText;
  if (el.getAttribute("data-ph") === "1") txt = "";
  txt = txt.replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").trim();
  var kind = el.getAttribute("data-live");
  if (kind === "org-notes") {
    updateOrg(el.getAttribute("data-org"), function (o) { o.notes = txt; return o; });
  } else if (kind === "projet-desc") {
    updateOrg(el.getAttribute("data-org"), function (o) { var pp = findProjet(o, el.getAttribute("data-projet")); if (pp) pp.description = txt; return o; });
  } else if (kind === "org-montant") {
    updateOrg(el.getAttribute("data-org"), function (o) { o.montantPotentiel = txt; return o; });
  } else if (kind === "projet-cout") {
    updateOrg(el.getAttribute("data-org"), function (o) { var pp = findProjet(o, el.getAttribute("data-projet")); if (pp) pp.cout = num(txt); return o; });
  } else if (kind === "ligne-src") {
    updateOrg(el.getAttribute("data-org"), function (o) { var pp = findProjet(o, el.getAttribute("data-projet")); var ll = pp && (pp.financement || {}).lignes || []; for (var i = 0; i < ll.length; i++) { if (ll[i].id === el.getAttribute("data-ligne")) ll[i].source = txt; } return o; });
  } else if (kind === "ligne-mont") {
    updateOrg(el.getAttribute("data-org"), function (o) { var pp = findProjet(o, el.getAttribute("data-projet")); var ll = pp && (pp.financement || {}).lignes || []; for (var j = 0; j < ll.length; j++) { if (ll[j].id === el.getAttribute("data-ligne")) ll[j].montant = num(txt); } return o; });
  }
  if (!state.modal) render();
}, true);

/* ===================== Lien profond (menu Mon Espace) ===================== */
function applyHash() {
  var h = "";
  try { h = decodeURIComponent(String(location.hash || "").replace(/^#/, "")); } catch (e) { h = String(location.hash || "").replace(/^#/, ""); }
  if (!h) return false;
  var parts = h.split("=");
  var key = parts[0];
  var val = parts[1] ? decodeURIComponent(parts[1]) : null;
  if (key === "dash" || key === "orgs" || key === "projets" || key === "aap" || key === "agenda" || key === "alerts" || key === "stats") {
    setState({ page: key, detailId: null, projetId: null });
    return true;
  }
  if (key === "org" && val) { setState({ page: "detail", detailId: val, projetId: null }); return true; }
  if (key === "projet" && val) {
    var ids = val.split("|");
    setState({ page: "projet", detailId: ids[0], projetId: ids[1] || null });
    return true;
  }
  return false;
}
window.addEventListener("hashchange", function () { applyHash(); });

if (!applyHash()) render();
</script>
