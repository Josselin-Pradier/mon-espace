/* ===================== Helpers ===================== */

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

function today() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

function daysUntil(dateStr) {
  if (!dateStr) return 9999;
  var t = new Date(today() + "T00:00:00").getTime();
  var x = new Date(dateStr + "T00:00:00").getTime();
  return Math.round((x - t) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return "—";
  return new Date(dateStr + "T00:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
}

function relLabel(dateStr) {
  var d = daysUntil(dateStr);
  if (d < 0) return { text: "en retard de " + (-d) + " j", tone: "overdue" };
  if (d === 0) return { text: "aujourd'hui", tone: "urgent" };
  if (d <= 7) return { text: "dans " + d + " j", tone: "urgent" };
  if (d <= 21) return { text: "dans " + d + " j", tone: "soon" };
  return { text: "dans " + d + " j", tone: "later" };
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function normNom(s) { return String(s || "").trim().toLowerCase(); }

function num(v) {
  var n = parseFloat(String(v == null ? "" : v).replace(/\u00a0|\s/g, "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}
function fmtE(n) {
  if (!isFinite(n)) n = 0;
  return n.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €";
}

/* --- Helpers CSV / téléchargement --- */
function csvEsc(v) {
  var s = String(v == null ? "" : v);
  if (/[";\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function toCSV(rows) {
  return rows.map(function (r) { return r.map(csvEsc).join(";"); }).join("\r\n");
}
function downloadText(name, content, mime, bom) {
  var parts = [];
  if (bom) parts.push("\ufeff");
  parts.push(content);
  var blob = new Blob(parts, { type: mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function alerteTypeInfo(t) { return TYPES_ALERTE.find(function (x) { return x.value === t; }) || TYPES_ALERTE[4]; }
function interactionInfo(t) { return TYPES_INTERACTION.find(function (x) { return x.value === t; }) || TYPES_INTERACTION[5]; }
function orgTypeInfo(t) { return TYPES_ORG.find(function (x) { return x.value === t; }) || TYPES_ORG[0]; }
function mecInfo(t) { return TYPES_MECENAT.find(function (x) { return x.value === t; }) || TYPES_MECENAT[0]; }
function mecTotal(list, type) { return (list || []).filter(function (m) { return m.type === type; }).reduce(function (s, m) { return s + num(m.montant); }, 0); }

function embeddedData() {
  try { return (typeof window !== "undefined" && window.__CRM_EMBEDDED_DATA__) || null; } catch (e) { return null; }
}

function loadOrgs() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        var changed = false;
        parsed = parsed.map(function (o) {
          var needs = !o.projets || (o.projets || []).some(function (p) { return !p.contributeurs; });
          if (needs) { changed = true; return migrateOrg(o); }
          return o;
        });
        if (changed) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (e2) { /* stockage indisponible */ } }
        return parsed;
      }
    }
  } catch (e) { /* stockage indisponible */ }
  var ed = embeddedData();
  if (ed && Array.isArray(ed.orgs)) return ed.orgs.map(migrateOrg);
  return JSON.parse(JSON.stringify(SEED)).map(migrateOrg);
}

function loadStatuts() {
  try {
    var raw = localStorage.getItem(STATUTS_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    }
  } catch (e) { /* stockage indisponible */ }
  var edS = embeddedData();
  if (edS && Array.isArray(edS.statuts) && edS.statuts.length) return edS.statuts;
  return JSON.parse(JSON.stringify(DEFAULT_STATUTS));
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.orgs));
    localStorage.setItem(STATUTS_KEY, JSON.stringify(state.statuts));
  } catch (e) { /* stockage indisponible */ }
}

function collectAlerts(orgs) {
  var res = [];
  orgs.forEach(function (o) {
    (o.alertes || []).forEach(function (a) {
      res.push({ key: a.id, orgId: o.id, orgNom: o.nom, libelle: a.libelle, type: a.type, date: a.date, notes: a.notes, faite: a.faite, auto: false });
    });
    (o.projets || []).forEach(function (p) {
      if (p.aap && p.aap.existant && p.aap.deadline) {
        res.push({ key: "aap-" + p.id, orgId: o.id, orgNom: o.nom, projetId: p.id, libelle: "Deadline AAP : " + (p.aap.nom || "appel à projets") + " — " + (p.nom || "projet"), type: "deadline-aap", date: p.aap.deadline, notes: p.aap.montant ? "Budget : " + p.aap.montant : "", faite: false, auto: true });
      }
    });
  });
  return res;
}

function finTotal(p) {
  var f = (p && p.financement) || {};
  return (f.lignes || []).reduce(function (s, l) { return s + num(l.montant); }, 0);
}
function finReste(p) {
  return num(p && p.cout) - finTotal(p);
}

function findProjet(org, pid) {

function projStatutBadge(v, orgId, projId) { var s = projStatutInfo(v); if (orgId && projId) return '<span class="badge ' + s.badge + '" style="cursor:pointer" data-act="qprojstatut" data-org="' + orgId + '" data-id="' + projId + '" title="Cliquer pour changer le statut du projet">' + s.label + ' ✎</span>'; return '<span class="badge ' + s.badge + '">' + s.label + '</span>'; }
function projAap(p) { return p && p.aap && p.aap.existant ? p.aap : null; }

/* Migration : convertit une fiche de l'ancien modèle (financement + aap au niveau de
   la fiche) vers le nouveau modèle (projets rattachés à l'établissement). */
function migrateOrg(o) {
  if (o.projets) {
    o.projets.forEach(function (p) {
      if (!p.contributeurs) p.contributeurs = [];
      ((p.financement || {}).lignes || []).forEach(function (l) { if (!l.orgId) l.orgId = ""; });
    });
    return o;
  }
  var projets = [];
  var aapVide = { existant: false, nom: "", deadline: "", montant: "", lien: "" };
  var fin = o.financement;
  if (fin && (fin.nom || num(fin.cout) > 0 || (fin.lignes || []).length > 0)) {
    projets.push({
      id: uid(),
      nom: fin.nom || "Projet",
      statut: o.projetRealise ? "termine" : "en-cours",
      cout: num(fin.cout),
      annee: "",
      description: o.projetDetails || "",
      financement: { lignes: (fin.lignes || []).map(function (l) { return { id: l.id, source: l.source, montant: l.montant, orgId: l.orgId || "" }; }) },
      contributeurs: [],
      aap: (o.aap && o.aap.existant) ? o.aap : aapVide
    });
  }
  if (o.aap && o.aap.existant && projets.length === 0) {
    projets.push({
      id: uid(),
      nom: "Candidature " + (o.aap.nom || "AAP"),
      statut: "prospection",
      cout: num(o.aap.montant),
      annee: "",
      description: "",
      financement: { lignes: [] },
      contributeurs: [],
      aap: o.aap
    });
  }
  if (projets.length === 0 && o.projetRealise && o.projetDetails) {
    projets.push({
      id: uid(),
      nom: "Projet réalisé",
      statut: "termine",
      cout: 0,
      annee: "",
      description: o.projetDetails,
      financement: { lignes: [] },
      contributeurs: [],
      aap: aapVide
    });
  }
  o.projets = projets;
  delete o.financement;
  delete o.aap;
  delete o.projetRealise;
  delete o.projetDetails;
  return o;
}

/* Historique de navigation (Reculer / Avancer, comme un navigateur) */
var nav = { stack: [{ page: "dash", detailId: null, projetId: null }], index: 0 };
function navSync() {
  var cur = nav.stack[nav.index];
  if (cur && cur.page === state.page && cur.detailId === state.detailId && cur.projetId === state.projetId) return;
  nav.stack = nav.stack.slice(0, nav.index + 1);
  nav.stack.push({ page: state.page, detailId: state.detailId, projetId: state.projetId });
  nav.index = nav.stack.length - 1;
}

function alertRowHtml(a, opts) {
  opts = opts || {};
  var rel = relLabel(a.date);
  var ti = alerteTypeInfo(a.type);
  var cls = "alert-row" + (a.faite ? " done" : rel.tone === "overdue" ? " overdue" : "");
  var ops = "";
  if (!a.auto) {
    ops = '<div class="alert-ops">'
      + '<button class="btn sm" data-act="toggle-alert" data-org="' + a.orgId + '" data-id="' + a.key + '">' + (a.faite ? "Rouvrir" : "Marquer fait") + '</button>'
      + '<button class="btn sm" data-act="edit-alert" data-org="' + a.orgId + '" data-id="' + a.key + '" title="Voir / modifier l&#39;alerte">✎</button>'
      + '<button class="btn sm danger" data-act="delete-alert" data-org="' + a.orgId + '" data-id="' + a.key + '">Suppr.</button>'
      + '</div>';
  } else {
    ops = '<div class="alert-ops"><span class="badge b-sky">auto (deadline AAP)</span></div>';
  }
  var libClick = a.auto
    ? (a.projetId
        ? ' data-act="open-projet" data-org="' + a.orgId + '" data-id="' + a.projetId + '" title="Cliquer pour ouvrir le projet"'
        : ' data-act="open-org" data-id="' + a.orgId + '" title="Cliquer pour ouvrir la fiche"')
    : ' data-act="edit-alert" data-org="' + a.orgId + '" data-id="' + a.key + '" title="Cliquer pour voir / modifier"';
  var lib = a.faite
    ? '<span class="alert-lib" style="text-decoration:line-through;color:#64748b">' + esc(a.libelle) + '</span>'
    : '<button class="alert-lib" style="background:none;border:0;padding:0;color:#1e293b;font-weight:600;font-size:13px;cursor:pointer;text-decoration:underline dotted"' + libClick + '>' + esc(a.libelle) + '</button>';
  return '<div class="' + cls + '">'
    + '<div class="alert-main">'
    + (a.faite ? "" : '<span class="pill p-' + rel.tone + '">' + esc(rel.text) + '</span>')
    + lib
    + '<span class="alert-sub">'
    + '<span class="badge">' + esc(ti.label) + '</span>'
    + '<span>' + esc(formatDate(a.date)) + '</span>'
    + (opts.hideOrg ? "" : '<button class="org-link" data-act="open-org" data-id="' + a.orgId + '">' + esc(a.orgNom) + '</button>')
    + (a.notes ? '<span style="font-style:italic">— ' + esc(a.notes) + '</span>' : "")
    + '</span>'
    + '</div>'
    + ops
    + '</div>';
}

function viewDashboard() {
  var alerts = collectAlerts(state.orgs);
  var pending = alerts.filter(function (a) { return !a.faite; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var overdue = pending.filter(function (a) { return daysUntil(a.date) < 0; }).length;
  var partenaires = state.orgs.filter(function (o) { return o.statut === "partenaire"; }).length;
  var mecenats = state.orgs.filter(function (o) { return o.statut === "deja-mecene"; }).length;
  var aapActifs = 0, resteTotal = 0, nbProjets = 0, nbProjetsActifs = 0;
  state.orgs.forEach(function (o) {
    (o.projets || []).forEach(function (p) {
      nbProjets++;
      if (projetActif(p)) { nbProjetsActifs++; resteTotal += Math.max(0, finReste(p)); }
      if (projAap(p)) aapActifs++;
    });
  });
  var maxStatut = Math.max(1, state.statuts.map(function (s) { return state.orgs.filter(function (o) { return o.statut === s.value; }).length; }));
  var activity = [];
  state.orgs.forEach(function (o) { (o.historique || []).forEach(function (h) { activity.push(Object.assign({}, h, { orgId: o.id, orgNom: o.nom })); }); });
  activity.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  activity = activity.slice(0, 6);

  var stat = function (lbl, val, hint, tone) {
    return '<div class="card pad stat"><p class="lbl">' + lbl + '</p><p class="val" style="color:' + (tone || "#1e293b") + '">' + val + '</p>' + (hint ? '<p class="hint">' + hint + '</p>' : "") + '</div>';
  };

  var bars = state.statuts.map(function (s) {
    var n = state.orgs.filter(function (o) { return o.statut === s.value; }).length;
    var p = pal(s.color);
    return '<div><div class="bar-line"><span>' + esc(s.label) + '</span><span style="font-weight:700">' + n + '</span></div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:' + (n / maxStatut) * 100 + '%;background:' + p.bar + '"></div></div></div>';
  }).join("");

  var actHtml = activity.length === 0
    ? '<p style="font-size:13px;color:#94a3b8">Aucune interaction enregistrée.</p>'
    : activity.map(function (h) {
        return '<div class="list-row" style="cursor:pointer" data-act="edit-histo" data-org="' + h.orgId + '" data-id="' + h.id + '" title="Cliquer pour voir / modifier cet échange">'
          + '<div><p class="t"><button class="org-link" style="background:none;border:0;padding:0;color:#0f172a;font-weight:600;text-decoration:underline" data-act="open-org" data-id="' + h.orgId + '">' + esc(h.orgNom) + '</button></p><p class="s">' + esc(interactionInfo(h.type).label) + ' — ' + esc(h.resume) + '</p></div>'
          + '<span class="badge">' + esc(formatDate(h.date)) + '</span></div>';
      }).join("");

  var pendingHtml = pending.length === 0
    ? '<div class="ok-box">Aucune alerte en attente. Tout est à jour !</div>'
    : pending.slice(0, 6).map(function (a) { return alertRowHtml(a); }).join("");

  return '<div>'
    + '<div class="stat-grid">'
    + stat("Établissements", state.orgs.length, "entreprises, fondations, fonds de dotation")
    + stat("Projets", nbProjets, nbProjetsActifs + " actif(s)", "#0f766e")
    + stat("Partenaires", partenaires, "relations actives", "#047857")
    + stat("Déjà mécènes", mecenats, "financements passés", "#5b21b6")
    + stat("AAP identifiés", aapActifs, "appels à projets en cours", "#0284c7")
    + stat("Reste à financer", fmtE(resteTotal), "projets actifs", resteTotal > 0 ? "#be123c" : "#1e293b")
    + stat("Alertes en attente", pending.length, overdue + " en retard", overdue > 0 ? "#e11d48" : "#1e293b")
    + '</div>'
    + '<div class="dash-grid">'
    + '<div class="card pad"><div class="section-head"><h3>Prochaines alertes</h3><button class="btn sm" data-act="goto" data-page="alerts">Tout voir (' + pending.length + ')</button></div>' + pendingHtml + '</div>'
    + '<div>'
    + '<div class="card pad" style="margin-bottom:20px"><div class="section-head"><h3>Répartition par statut</h3><button class="btn sm" data-act="edit-statuts">✎ Éditer</button></div>' + bars + '</div>'
    + '<div class="card pad"><div class="section-head"><h3>Dernières interactions</h3><button class="btn sm" data-act="goto" data-page="orgs">Fiches</button></div>' + actHtml + '</div>'
    + '</div>'
    + '</div>'
    + '</div>';
}

function viewOrgs() {
  var q = state.query.trim().toLowerCase();
  var filtered = state.orgs.filter(function (o) {
    if (state.fType !== "tous" && o.type !== state.fType) return false;
    if (state.fStatut !== "tous" && o.statut !== state.fStatut) return false;
    if (!q) return true;
    return (o.nom || "").toLowerCase().indexOf(q) >= 0
      || (o.secteur || "").toLowerCase().indexOf(q) >= 0
      || (o.region || "").toLowerCase().indexOf(q) >= 0
      || (o.contacts || []).some(function (c) { return (c.nom || "").toLowerCase().indexOf(q) >= 0; })
      || (o.projets || []).some(function (p) { return (p.nom || "").toLowerCase().indexOf(q) >= 0; });
  });

  var statutOptions = state.statuts.map(function (s) {
    return '<option value="' + esc(s.value) + '"' + (state.fStatut === s.value ? " selected" : "") + '>' + esc(s.label) + '</option>';
  }).join("");

  var cards = filtered.length === 0
    ? '<div class="empty">Aucune fiche ne correspond à la recherche.</div>'
    : '<div class="org-grid">' + filtered.map(function (o) {
        var nextAlert = (o.alertes || []).filter(function (a) { return !a.faite; }).sort(function (a, b) { return a.date < b.date ? -1 : 1; })[0];
        var mainContact = (o.contacts || []).find(function (c) { return c.principal; }) || (o.contacts || [])[0];
        var tags = "";
        if (o.refugeLPO) tags += '<span class="badge b-emerald">🌿 Refuge LPO</span>';
        var pjList = orgProjets(o);
        var pjActifs = pjList.filter(projetActif).length;
        if (pjList.length > 0) tags += '<span class="badge b-teal">📁 ' + pjList.length + ' projet(s)' + (pjActifs > 0 ? " · " + pjActifs + " actif(s)" : "") + '</span>';
        var pjDeadlines = pjList.map(function (p) { return projAap(p) && projAap(p).deadline; }).filter(Boolean).sort();
        if (pjDeadlines.length > 0) tags += '<span class="badge b-sky">📢 AAP · ' + esc(formatDate(pjDeadlines[0])) + '</span>';
        if (pjDeadlines.length > 0 && daysUntil(pjDeadlines[0]) < 0) tags += '<span class="badge b-rose">⏰ deadline dépassée</span>';
        var ti = orgTypeInfo(o.type);
        if ((o.mecenats || []).length > 0) tags += '<span class="badge b-emerald">🤝 Mécénat × ' + (o.mecenats || []).length + '</span>';
        return '<button class="card org-card" data-act="open-org" data-id="' + o.id + '">'
          + '<div class="row between"><div style="min-width:0"><p class="nom">' + esc(o.nom) + '</p>'
          + '<p class="sub">' + ti.icon + " " + ti.label + (o.secteur ? " · " + esc(o.secteur) : "") + (o.region ? " · " + esc(o.region) : "") + '</p></div>'
          + statutBadge(o.statut, o.id) + '</div>'
          + '<div class="tags">' + tags + '</div>'
          + '<div class="foot"><span>' + (mainContact ? "👤 " + esc(mainContact.nom) : "Aucun contact enregistré") + '</span>'
          + (nextAlert ? '<span class="pill p-' + relLabel(nextAlert.date).tone + '">⏰ ' + esc(formatDate(nextAlert.date)) + '</span>' : "")
          + '</div></button>';
      }).join("") + '</div>';

  return '<div>'
    + '<div class="filters">'
    + '<div class="search-wrap"><input id="search" placeholder="Rechercher une structure, un contact, un secteur…" value="' + esc(state.query) + '"/>'
    + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div>'
    + '<select data-filter="fType" style="max-width:200px"><option value="tous"' + (state.fType === "tous" ? " selected" : "") + '>Tous les types</option>' + TYPES_ORG.map(function (t) { return '<option value="' + t.value + '"' + (state.fType === t.value ? " selected" : "") + '>' + t.plural + '</option>'; }).join("") + '</select>'
    + '<select data-filter="fStatut" style="max-width:190px"><option value="tous"' + (state.fStatut === "tous" ? " selected" : "") + '>Tous les statuts</option>' + statutOptions + '</select>'
    + '<button class="btn primary" style="margin-left:auto" data-act="new-org">＋ Nouvel établissement</button>'
    + '</div>'
    + cards + '</div>';
}

/* ===================== Onglet Projets ===================== */

function viewProjets() {
  var items = allProjets();
  if (state.pStatut !== "tous") items = items.filter(function (it) { return it.projet.statut === state.pStatut; });
  var ordre = function (s) { return s === "en-cours" ? 0 : s === "prospection" ? 1 : s === "termine" ? 2 : 3; };
  items.sort(function (a, b) { return ordre(a.projet.statut) - ordre(b.projet.statut) || ((a.projet.nom || "") < (b.projet.nom || "") ? -1 : 1); });

  var cards = items.length === 0
    ? '<div class="empty">Aucun projet ne correspond au filtre. Créez un projet depuis un établissement ou le bouton « Nouveau projet ».</div>'
    : '<div class="org-grid">' + items.map(function (it) {
        var p = it.projet;
        var tot = finTotal(p);
        var reste = finReste(p);
        var pct = num(p.cout) > 0 ? Math.min(100, Math.round(tot / num(p.cout) * 100)) : 0;
        var aap = projAap(p);
        return '<button class="card org-card" data-act="open-projet" data-org="' + it.orgId + '" data-id="' + p.id + '">'
          + '<div class="row between"><div style="min-width:0"><p class="nom">' + esc(p.nom || "Projet") + '</p>'
          + '<p class="sub">🏢 ' + esc(it.orgNom) + (p.annee ? " · " + esc(p.annee) : "") + ((p.contributeurs || []).length > 0 ? ' <span style="color:#0284c7">+' + (p.contributeurs || []).length + ' co-financé(s)</span>' : "") + '</p></div>'
          + projStatutBadge(p.statut, it.orgId, p.id) + '</div>'
          + '<div class="tags">'
          + (num(p.cout) > 0 ? '<span class="badge b-amber">💰 ' + fmtE(num(p.cout)) + ' · ' + pct + ' % financé</span>' : "")
          + (aap ? '<span class="badge b-sky">📢 ' + esc(aap.nom || "AAP") + (aap.deadline ? " · " + esc(formatDate(aap.deadline)) : "") + '</span>' : "")
          + '</div>'
          + '<div class="foot"><span>' + (num(p.cout) > 0 ? "Financé : " + fmtE(tot) + " · Reste : " + fmtE(Math.max(0, reste)) : "Financement non renseigné") + '</span></div>'
          + '</button>';
      }).join("") + '</div>';

  var stOpts = PROJET_STATUTS.map(function (s) {
    return '<option value="' + s.value + '"' + (state.pStatut === s.value ? " selected" : "") + '>' + s.label + '</option>';
  }).join("");

  return '<div>'
    + '<div class="filters">'
    + '<select data-filter="pStatut" style="max-width:200px"><option value="tous"' + (state.pStatut === "tous" ? " selected" : "") + '>Tous les projets</option>' + stOpts + '</select>'
    + '<button class="btn primary" style="margin-left:auto" data-act="new-projet">＋ Nouveau projet</button>'
    + '</div>'
    + cards + '</div>';
}

function viewAlerts() {
  var alerts = collectAlerts(state.orgs);
  var filtered = alerts
    .filter(function (a) { return state.showDone || !a.faite; })
    .filter(function (a) { return state.alertType === "toutes" || a.type === state.alertType; })
    .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var overdue = filtered.filter(function (a) { return !a.faite && daysUntil(a.date) < 0; }).length;
  var thisWeek = filtered.filter(function (a) { return !a.faite && daysUntil(a.date) >= 0 && daysUntil(a.date) <= 7; }).length;

  var typeOptions = TYPES_ALERTE.map(function (t) {
    return '<option value="' + t.value + '"' + (state.alertType === t.value ? " selected" : "") + '>' + t.label + '</option>';
  }).join("");

  return '<div>'
    + '<div class="filters">'
    + '<select data-filter="alertType" style="max-width:230px"><option value="toutes"' + (state.alertType === "toutes" ? " selected" : "") + '>Tous les types de rappel</option>' + typeOptions + '</select>'
    + '<label class="chk" style="margin:0"><input type="checkbox" data-filter="showDone"' + (state.showDone ? " checked" : "") + '/> Afficher les alertes traitées</label>'
    + '<div style="margin-left:auto;display:flex;gap:6px">'
    + (overdue > 0 ? '<span class="badge b-rose">' + overdue + ' en retard</span>' : "")
    + (thisWeek > 0 ? '<span class="badge b-amber">' + thisWeek + ' dans les 7 jours</span>' : "")
    + '</div></div>'
    + (filtered.length === 0 ? '<div class="empty">Aucune alerte à afficher.</div>'
       : filtered.map(function (a) { return alertRowHtml(a); }).join(""))
    + '</div>';
}

/* ===================== Agenda interne (v3) ===================== */
function viewAgenda() {
  var items = collectAlerts(state.orgs).filter(function (a) { return a.date; });
  items.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var passes = items.filter(function (a) { return !a.faite && daysUntil(a.date) < 0; });
  var semaine = items.filter(function (a) { return !a.faite && daysUntil(a.date) >= 0 && daysUntil(a.date) <= 7; });
  var plusTard = items.filter(function (a) { return !a.faite && daysUntil(a.date) > 7; });

  var group = function (titre, arr) {
    if (!arr.length) return "";
    return '<h3 style="margin:18px 0 8px;font-size:15px;color:#334155">' + titre + " (" + arr.length + ")</h3>"
      + arr.map(function (a) { return alertRowHtml(a); }).join("");
  };

  return '<div>'
    + '<div class="filters">'
    + '<span class="badge b-rose">' + passes.length + ' en retard</span>'
    + '<span class="badge b-amber">' + semaine.length + ' dans les 7 jours</span>'
    + '<span class="badge">' + plusTard.length + ' plus tard</span>'
    + '<p style="margin:0;font-size:12.5px;color:#64748b">Vue chronologique de tous les rendez-vous du mécénat : relances, rappels et deadlines d&#39;AAP. Les mêmes échéances alimentent le calendrier 📅 de Mon Espace.</p>'
    + '<button class="btn primary" style="margin-left:auto" data-act="new-alert-any">＋ Ajouter un rappel</button>'
    + '</div>'
    + (items.length === 0 ? '<div class="empty">Aucune échéance enregistrée pour l&#39;instant. Ajoutez une relance depuis la fiche d&#39;un établissement, ou une deadline d&#39;AAP depuis un projet.</div>' : "")
    + group("🚨 En retard", passes)
    + group("📅 Dans les 7 prochains jours", semaine)
    + group("⏳ Plus tard", plusTard)
    + '</div>';
}

function viewAap() {
  var items = [];
  state.orgs.forEach(function (o) {
    (o.projets || []).forEach(function (p) {
      if (p.aap && p.aap.existant) items.push({ orgId: o.id, orgNom: o.nom, projetId: p.id, projetNom: p.nom, aap: p.aap });
    });
  });
  var filtered = items.filter(function (it) {
    var d = it.aap.deadline ? daysUntil(it.aap.deadline) : 9999;
    if (state.aapFilter === "avenir") return d >= 0;
    if (state.aapFilter === "passes") return d < 0;
    return true;
  });
  filtered.sort(function (a, b) { return (a.aap.deadline || "9999") < (b.aap.deadline || "9999") ? -1 : 1; });

  var rows = filtered.length === 0
    ? '<div class="empty">Aucun AAP à afficher.</div>'
    : filtered.map(function (it) {
        var dl = it.aap.deadline ? relLabel(it.aap.deadline) : null;
        return '<div class="list-row">'
          + '<div style="min-width:0;flex:1">'
          + '<p class="t">' + esc(it.aap.nom || "Appel à projets") + ' ' + (dl ? '<span class="pill p-' + dl.tone + '">' + esc(dl.text) + '</span>' : "") + '</p>'
          + '<p class="s"><button class="org-link" style="background:none;border:0;padding:0;color:#047857;font-weight:600;text-decoration:underline" data-act="open-org" data-id="' + it.orgId + '">' + esc(it.orgNom) + '</button>'
          + (it.projetNom ? ' · projet : ' + esc(it.projetNom) : "")
          + (it.aap.deadline ? ' · limite : ' + esc(formatDate(it.aap.deadline)) : "")
          + (it.aap.montant ? ' · dotation : ' + esc(it.aap.montant) : "")
          + (it.aap.lien ? ' · <a href="' + esc(it.aap.lien) + '" target="_blank" rel="noreferrer">lien</a>' : "")
          + '</p></div>'
          + '<div style="display:flex;gap:6px">'
          + '<button class="btn sm" data-act="edit-aap" data-org="' + it.orgId + '" data-projet="' + it.projetId + '">✎ Éditer</button>'
          + '<button class="btn sm" data-act="open-projet" data-org="' + it.orgId + '" data-id="' + it.projetId + '">Projet</button>'
          + '</div></div>';
      }).join("");

  var passes = items.filter(function (it) { return it.aap.deadline && daysUntil(it.aap.deadline) < 0; }).length;

  return '<div>'
    + '<div class="filters">'
    + '<select data-filter="aapFilter" style="max-width:220px">'
    + '<option value="tous"' + (state.aapFilter === "tous" ? " selected" : "") + '>Tous les AAP</option>'
    + '<option value="avenir"' + (state.aapFilter === "avenir" ? " selected" : "") + '>Deadlines à venir</option>'
    + '<option value="passes"' + (state.aapFilter === "passes" ? " selected" : "") + '>Deadlines dépassées</option>'
    + '</select>'
    + (passes > 0 ? '<span class="badge b-rose">' + passes + ' deadline(s) dépassée(s)</span>' : "")
    + '<button class="btn primary" style="margin-left:auto" data-act="new-aap">＋ Ajouter un AAP</button>'
    + '</div>'
    + rows + '</div>';
}

function viewStats() {
  var totalEchanges = 0, totalContacts = 0, totalFin = 0, totalReste = 0;
  var totalMec = 0, nbMec = 0;
  var nbProjets = 0, nbProjetsActifs = 0, nbAap = 0, coutTotal = 0;
  var mecParType = {};
  TYPES_MECENAT.forEach(function (t) { mecParType[t.value] = { n: 0, total: 0 }; });
  state.orgs.forEach(function (o) {
    totalEchanges += (o.historique || []).length;
    totalContacts += (o.contacts || []).length;
    (o.mecenats || []).forEach(function (mc) {
      nbMec++;
      totalMec += num(mc.montant);
      if (mecParType[mc.type]) { mecParType[mc.type].n++; mecParType[mc.type].total += num(mc.montant); }
    });
    (o.projets || []).forEach(function (p) {
      nbProjets++;
      coutTotal += num(p.cout);
      totalFin += finTotal(p);
      if (projetActif(p)) { nbProjetsActifs++; totalReste += Math.max(0, finReste(p)); }
      if (projAap(p)) nbAap++;
    });
  });

  var stat = function (lbl, val, hint, tone) {
    return '<div class="card pad stat"><p class="lbl">' + lbl + '</p><p class="val" style="color:' + (tone || "#1e293b") + '">' + val + '</p>' + (hint ? '<p class="hint">' + hint + '</p>' : "") + '</div>';
  };

  var statutRows = state.statuts.map(function (s) {
    var n = state.orgs.filter(function (o) { return o.statut === s.value; }).length;
    var pct = state.orgs.length ? Math.round(n / state.orgs.length * 100) : 0;
    var p = pal(s.color);
    return '<tr class="clickable" data-act="goto-filtered" data-statut="' + esc(s.value) + '">'
      + '<td>' + statutBadge(s.value) + '</td>'
      + '<td class="num">' + n + '</td>'
      + '<td style="min-width:140px"><div class="bar-track" style="margin:0"><div class="bar-fill" style="width:' + pct + '%;background:' + p.bar + '"></div></div></td>'
      + '<td class="num">' + pct + ' %</td></tr>';
  }).join("");

  var ficheRows = state.orgs.map(function (o) {
    var pjList = orgProjets(o);
    var pjActifs = pjList.filter(projetActif).length;
    return '<tr class="clickable" data-act="open-org" data-id="' + o.id + '">'
      + '<td style="font-weight:600">' + esc(o.nom) + '</td>'
      + '<td>' + statutBadge(o.statut, o.id) + '</td>'
      + '<td class="num">' + pjList.length + (pjActifs > 0 ? ' <span style="color:#b45309">(' + pjActifs + ' actif)</span>' : "") + '</td>'
      + '<td class="num">' + (o.historique || []).length + '</td>'
      + '<td class="num">' + (o.contacts || []).length + '</td>'
      + '<td class="num">' + ((o.mecenats || []).length > 0 ? ((o.mecenats.length) + ' · ' + fmtE(o.mecenats.reduce(function (s, mc) { return s + num(mc.montant); }, 0))) : "—") + '</td>'
      + '</tr>';
  }).join("");

  var projetRows = allProjets().map(function (it) {
    var p = it.projet;
    var aap = projAap(p);
    var aapCell = aap
      ? (aap.deadline ? '<span class="pill p-' + relLabel(aap.deadline).tone + '">' + esc(formatDate(aap.deadline)) + '</span>' : '<span class="badge b-sky">AAP</span>')
      : '<span style="color:#94a3b8">—</span>';
    return '<tr class="clickable" data-act="open-projet" data-org="' + it.orgId + '" data-id="' + p.id + '">'
      + '<td style="font-weight:600">' + esc(p.nom || "Projet") + '</td>'
      + '<td>' + esc(it.orgNom) + (((p.contributeurs || []).length > 0) ? ' <span class="badge b-sky">+' + p.contributeurs.length + '</span>' : "") + '</td>'
      + '<td>' + projStatutBadge(p.statut, it.orgId, p.id) + '</td>'
      + '<td class="num">' + (num(p.cout) > 0 ? fmtE(num(p.cout)) : "—") + '</td>'
      + '<td class="num">' + (finTotal(p) > 0 ? fmtE(finTotal(p)) : "—") + '</td>'
      + '<td class="num" style="' + (finReste(p) > 0 ? "color:#be123c" : "color:#047857;font-weight:600") + '">' + (num(p.cout) > 0 ? fmtE(Math.max(0, finReste(p))) : "—") + '</td>'
      + '<td>' + aapCell + '</td>'
      + '</tr>';
  }).join("");

  return '<div>'
    + '<div class="stat-grid">'
    + stat("Établissements", state.orgs.length, "structures suivies")
    + stat("Projets", nbProjets, nbProjetsActifs + " actif(s)", "#0f766e")
    + stat("Échanges", totalEchanges, "interactions enregistrées")
    + stat("Contacts", totalContacts, "personnes suivies")
    + stat("AAP actifs", nbAap, "appels à projets", "#0284c7")
    + stat("Financement acquis", fmtE(totalFin), "sur " + fmtE(coutTotal) + " de projets", "#047857")
    + stat("Reste à financer", fmtE(totalReste), "projets actifs", totalReste > 0 ? "#be123c" : "#1e293b")
    + stat("Mécénat valorisé", fmtE(totalMec), nbMec + " mécénat(s) : financier, nature, compétence", "#065f46")
    + '</div>'
    + '<div class="card pad" style="margin-bottom:20px"><div class="section-head"><h3>Répartition par statut</h3><button class="btn sm" data-act="edit-statuts">✎ Éditer les statuts</button></div>'
    + '<table class="stats-table"><thead><tr><th>Statut</th><th class="num">Fiches</th><th></th><th class="num">Part</th></tr></thead><tbody>' + statutRows + '</tbody></table></div>'
    + '<div class="card pad" style="margin-bottom:20px"><div class="section-head"><h3>Mécénats par type</h3></div>'
    + '<table class="stats-table"><thead><tr><th>Type de mécénat</th><th class="num">Nombre</th><th class="num">Montant valorisé</th></tr></thead><tbody>'
    + TYPES_MECENAT.map(function (t) {
        return '<tr><td><span class="badge ' + t.badge + '">' + t.icon + " " + t.label + '</span></td>'
          + '<td class="num">' + mecParType[t.value].n + '</td>'
          + '<td class="num">' + fmtE(mecParType[t.value].total) + '</td></tr>';
      }).join("")
    + '<tr class="total"><td>Total</td><td class="num">' + nbMec + '</td><td class="num">' + fmtE(totalMec) + '</td></tr>'
    + '</tbody></table></div>'
    + '<div class="card pad" style="margin-bottom:20px"><div class="section-head"><h3>Vue détaillée par projet</h3></div>'
    + '<table class="stats-table"><thead><tr><th>Projet</th><th>Établissement</th><th>Statut</th><th class="num">Coût</th><th class="num">Financé</th><th class="num">Reste</th><th>AAP</th></tr></thead><tbody>'
    + projetRows
    + '<tr class="total"><td>Totaux</td><td></td><td></td><td class="num">' + fmtE(coutTotal) + '</td><td class="num">' + fmtE(totalFin) + '</td><td class="num" style="color:#be123c">' + fmtE(totalReste) + '</td><td></td></tr>'
    + '</tbody></table></div>'
    + '<div class="card pad"><div class="section-head"><h3>Vue par établissement</h3></div>'
    + '<table class="stats-table"><thead><tr><th>Établissement</th><th>Statut</th><th class="num">Projets</th><th class="num">Échanges</th><th class="num">Contacts</th><th class="num">Mécénats</th></tr></thead><tbody>'
    + ficheRows
    + '<tr class="total"><td>Totaux</td><td></td><td class="num">' + nbProjets + '</td><td class="num">' + totalEchanges + '</td><td class="num">' + totalContacts + '</td><td class="num">' + nbMec + '</td></tr>'
    + '</tbody></table></div>'
    + '</div>';
}

function viewDetail() {
  var org = findOrg(state.detailId);
  if (!org) { state.page = "orgs"; return viewOrgs(); }

  var contactsHtml = (org.contacts || []).length === 0
    ? '<p style="font-size:13px;color:#94a3b8">Aucun contact enregistré.</p>'
    : org.contacts.map(function (c) {
        return '<div class="list-row" style="cursor:pointer" data-act="view-contact" data-org="' + org.id + '" data-id="' + c.id + '" title="Cliquer pour voir la fiche du contact"><div style="min-width:0">'
          + '<button class="t" style="background:none;border:0;padding:0;color:#0f172a;font-weight:600;font-size:13px;text-decoration:underline" data-act="view-contact" data-org="' + org.id + '" data-id="' + c.id + '">' + esc(c.nom) + '</button> '
          + (c.principal ? '<span class="badge b-emerald">principal</span>' : "")
          + '<p class="s">' + esc(c.fonction || "") + (c.email ? " · " + esc(c.email) : "") + (c.tel ? " · " + esc(c.tel) : "") + '</p></div>'
          + '<div style="display:flex;gap:6px">'
          + '<button class="btn sm" data-act="edit-contact" data-org="' + org.id + '" data-id="' + c.id + '">Éditer</button>'
          + '<button class="btn sm danger" data-act="delete-contact" data-org="' + org.id + '" data-id="' + c.id + '">Suppr.</button>'
          + '</div></div>';
      }).join("");

  var histoHtml = (org.historique || []).length === 0
    ? '<p style="font-size:13px;color:#94a3b8">Aucun échange enregistré pour le moment.</p>'
    : org.historique.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (h) {
        return '<div class="hist" style="cursor:pointer" data-act="edit-histo" data-org="' + org.id + '" data-id="' + h.id + '" title="Cliquer pour voir / modifier cet échange"><div style="flex:1">'
          + '<div class="head"><span class="d">' + esc(formatDate(h.date)) + '</span>'
          + '<span class="badge">' + esc(interactionInfo(h.type).label) + '</span>'
          + (h.contact ? '<span style="font-size:11.5px;color:#64748b">avec ' + esc(h.contact) + '</span>' : "")
          + (h.projetId ? (function () { var hp = findProjetGlobal(h.projetId); return hp ? '<button class="org-link" style="background:none;border:0;padding:0;color:#0284c7;font-weight:600;text-decoration:underline;font-size:11.5px" data-act="open-projet" data-org="' + hp.orgId + '" data-id="' + h.projetId + '" title="Ouvrir le projet">📁 ' + esc(hp.projet.nom || "Projet") + '</button>' : ""; })() : "")
          + '</div><p class="txt">' + esc(h.resume) + '</p></div>'
          + '<div style="display:flex;gap:6px;align-items:center">'
          + '<button class="btn sm" data-act="edit-histo" data-org="' + org.id + '" data-id="' + h.id + '">✎</button>'
          + '<button class="btn sm danger" data-act="delete-histo" data-org="' + org.id + '" data-id="' + h.id + '">Suppr.</button>'
          + '</div></div>';
      }).join("");

  var alertesHtml = (org.alertes || []).length === 0
    ? '<p style="font-size:13px;color:#94a3b8">Aucune alerte programmée pour cette fiche.</p>'
    : org.alertes.slice().sort(function (a, b) { return (a.faite ? 1 : 0) - (b.faite ? 1 : 0) || (a.date < b.date ? -1 : 1); }).map(function (a) {
        return alertRowHtml({ key: a.id, orgId: org.id, orgNom: org.nom, libelle: a.libelle, type: a.type, date: a.date, notes: a.notes, faite: a.faite, auto: false }, { hideOrg: true });
      }).join("");
  if ((org.alertes || []).length > 0 && org.alertes.every(function (a) { return a.faite; })) {
    alertesHtml = '<div class="ok-box">Toutes les alertes ont été traitées.</div>' + alertesHtml;
  }

  /* --- Projets de l'établissement --- */
  var pjList = org.projets || [];
  var projetsHtml = pjList.length === 0
    ? '<p style="font-size:13px;color:#94a3b8;margin:8px 0">Aucun projet enregistré pour cet établissement.</p>'
    : pjList.map(function (p) {
        var tot = finTotal(p);
        var pct = num(p.cout) > 0 ? Math.min(100, Math.round(tot / num(p.cout) * 100)) : 0;
        var aap = projAap(p);
        var sub = [];
        if (num(p.cout) > 0) sub.push("Coût : " + fmtE(num(p.cout)) + " · " + pct + " % financé");
        else sub.push("Financement non renseigné");
        if (p.annee) sub.push(esc(p.annee));
        if (aap && aap.deadline) sub.push("AAP : " + esc(formatDate(aap.deadline)));
        return '<div class="list-row" style="cursor:pointer" data-act="open-projet" data-org="' + org.id + '" data-id="' + p.id + '" title="Ouvrir le projet"><div style="min-width:0">'
          + '<p class="t">' + esc(p.nom || "Projet") + ' ' + projStatutBadge(p.statut, org.id, p.id) + '</p>'
          + '<p class="s">' + sub.join(" · ") + '</p></div>'
          + '<div style="display:flex;gap:6px;align-items:center">'
          + '<button class="btn sm" data-act="edit-projet" data-org="' + org.id + '" data-id="' + p.id + '" title="Modifier le projet">✎</button>'
          + '<button class="btn sm danger" data-act="delete-projet" data-org="' + org.id + '" data-id="' + p.id + '">Suppr.</button>'
          + '</div></div>';
      }).join("");

  /* --- Co-financements (projets portés par d'autres établissements) --- */
  var coList = [];
  state.orgs.forEach(function (o2) {
    if (o2.id === org.id) return;
    (o2.projets || []).forEach(function (p) {
      if ((p.contributeurs || []).indexOf(org.id) >= 0) coList.push({ porteurId: o2.id, porteurNom: o2.nom, projet: p });
    });
  });
  var coHtml = coList.length === 0
    ? '<p style="font-size:13px;color:#94a3b8;margin:8px 0">Cet établissement ne co-finance aucun projet porté par un autre établissement.</p>'
    : coList.map(function (it2) {
        var p = it2.projet;
        var tot2 = finTotal(p);
        return '<div class="list-row" style="cursor:pointer" data-act="open-projet" data-org="' + it2.porteurId + '" data-id="' + p.id + '" title="Ouvrir le projet"><div style="min-width:0">'
          + '<p class="t">' + esc(p.nom || "Projet") + ' ' + projStatutBadge(p.statut, it2.porteurId, p.id) + ' <span class="badge b-sky">co-financement</span></p>'
          + '<p class="s">chez ' + esc(it2.porteurNom) + (num(p.cout) > 0 ? " · Coût : " + fmtE(num(p.cout)) : "") + (tot2 > 0 ? " · Financé : " + fmtE(tot2) : "") + '</p></div>'
          + '<div style="display:flex;gap:6px;align-items:center">'
          + '<button class="btn sm" data-act="open-projet" data-org="' + it2.porteurId + '" data-id="' + p.id + '">Ouvrir</button>'
          + '</div></div>';
      }).join("");

  /* --- Mécénats (financier / nature / compétence) --- */
  var mecList = org.mecenats || [];
  var mecenatsHtml;
  if (mecList.length === 0) {
    mecenatsHtml = '<p style="font-size:13px;color:#94a3b8;margin:8px 0">Aucun mécénat enregistré pour cette structure (financier, nature ou compétence).</p>';
  } else {
    mecenatsHtml = mecList.map(function (m2) {
      var mi = mecInfo(m2.type);
      var det = [];
      if (m2.description) det.push(esc(m2.description));
      if (m2.poste) det.push("Poste : " + esc(m2.poste));
      if (m2.personnel) det.push("Personnel : " + esc(m2.personnel));
      if (m2.mission) det.push("Mission : " + esc(m2.mission));
      return '<div class="list-row"><div style="min-width:0">'
        + '<p class="t"><span class="badge ' + mi.badge + '">' + mi.icon + " " + mi.label + '</span>'
        + (num(m2.montant) > 0 ? ' <b>' + fmtE(num(m2.montant)) + '</b>' : "") + '</p>'
        + (det.length ? '<p class="s">' + det.join(" · ") + '</p>' : "")
        + '</div>'
        + '<div style="display:flex;gap:6px">'
        + '<button class="btn sm" data-act="edit-mecenat" data-org="' + org.id + '" data-id="' + m2.id + '" title="Modifier ce mécénat">✎</button>'
        + '<button class="btn sm danger" data-act="delete-mecenat" data-org="' + org.id + '" data-id="' + m2.id + '">Suppr.</button>'
        + '</div></div>';
    }).join("");
    var mecSum = mecList.reduce(function (s, m2) { return s + num(m2.montant); }, 0);
    var mecTotBadges = TYPES_MECENAT.map(function (t) {
      var n = mecList.filter(function (m2) { return m2.type === t.value; }).length;
      if (n === 0) return "";
      return '<span class="badge ' + t.badge + '">' + t.icon + " " + t.label + " : " + n + " · " + fmtE(mecTotal(mecList, t.value)) + '</span>';
    }).filter(Boolean).join(" ");
    mecenatsHtml += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center">' + mecTotBadges
      + '<span class="badge" style="margin-left:auto">Total valorisé : <b>' + fmtE(mecSum) + '</b></span></div>';
  }

  return '<div>'
    + '<div class="row between" style="margin-bottom:16px">'
    + '<button class="btn" data-act="goto" data-page="orgs">← Retour aux établissements</button>'
    + '<button class="btn danger" data-act="delete-org" data-id="' + org.id + '">Supprimer l&#39;établissement</button>'
    + '</div>'
    + '<div class="card pad" style="padding:22px">'
    + '<div class="row between"><div><div class="row" style="gap:10px"><h2 style="margin:0;font-size:22px">' + esc(org.nom) + '</h2>'
    + statutBadge(org.statut, org.id)
    + '<span class="badge">' + orgTypeInfo(org.type).icon + " " + orgTypeInfo(org.type).label + '</span></div>'
    + '<p style="margin:4px 0 0;font-size:13px;color:#64748b">' + esc([org.secteur, org.region].filter(Boolean).join(" · ")) + '</p></div>'
    + '<button class="btn primary" data-act="edit-org" data-id="' + org.id + '">✎ Modifier la fiche</button></div>'
    + '<div class="info-grid">'
    + '<div><p class="k">Site web</p><p class="v">' + (org.siteWeb ? '<a href="' + esc(org.siteWeb) + '" target="_blank" rel="noreferrer">' + esc(org.siteWeb.replace(/^https?:\/\//, "")) + '</a>' : "—") + '</p></div>'
    + '<div><p class="k">Montant potentiel</p><p class="v" contenteditable="true" data-live="org-montant" data-org="' + org.id + '" title="Cliquez pour modifier — enregistrement automatique" style="outline:none;min-height:22px">' + esc(org.montantPotentiel || "—") + '</p></div>'
    + '<div><p class="k">Refuge LPO</p><p class="v">' + (org.refugeLPO ? '<span style="color:#047857;font-weight:600">Oui' + (org.refugeDetails ? ' <span style="font-weight:400;color:#64748b">— ' + esc(org.refugeDetails) + '</span>' : "") + '</span>' : "Non") + '</p></div>'
    + '<div><p class="k">Projets</p><p class="v">' + (org.projets || []).length + ' enregistré(s)' + (coList.length > 0 ? " · " + coList.length + " co-financé(s)" : "") + '</p></div>'
    + '</div>'
    + '<div class="note-box" style="padding:10px 12px;margin-top:14px">'
    + '<p style="margin:0 0 6px;font-size:12px;font-weight:600;color:#64748b">📝 Notes libres — cliquez ci-dessous, l&#39;enregistrement est automatique en cliquant ailleurs</p>'
    + '<div contenteditable="true" data-live="org-notes" data-org="' + org.id + '"' + (org.notes ? '' : ' data-ph="1"') + ' style="min-height:30px;outline:none;white-space:pre-wrap;font-size:13.5px;line-height:1.55">' + (org.notes ? esc(org.notes) : '<span style="color:#94a3b8">Vos notes sur cet établissement…</span>') + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Projets (' + (pjList.length + coList.length) + ')</h3>'
    + '<button class="btn sm" data-act="new-projet" data-org="' + org.id + '">＋ Nouveau projet</button></div>' + projetsHtml + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Co-financé chez d&#39;autres établissements (' + coList.length + ')</h3></div>' + coHtml + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Mécénats (' + (org.mecenats || []).length + ')</h3>'
    + '<button class="btn sm" data-act="new-mecenat" data-org="' + org.id + '">＋ Ajouter un mécénat</button></div>' + mecenatsHtml + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Contacts (' + (org.contacts || []).length + ')</h3>'
    + '<button class="btn sm" data-act="new-contact" data-org="' + org.id + '">＋ Ajouter un contact</button></div>' + contactsHtml + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Historique des échanges (' + (org.historique || []).length + ')</h3>'
    + '<button class="btn sm" data-act="new-histo" data-org="' + org.id + '">＋ Ajouter un échange</button></div>' + histoHtml + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Alertes &amp; rappels (' + (org.alertes || []).filter(function (a) { return !a.faite; }).length + ' en cours)</h3>'
    + '<button class="btn sm" data-act="new-alert" data-org="' + org.id + '">＋ Ajouter une alerte</button></div>' + alertesHtml + '</div>'
    + '</div>';
}

/* ===================== Page Projet ===================== */

function viewProjet() {
  var org = findOrg(state.detailId);
  var p = findProjet(org, state.projetId);
  if (!org || !p) { state.page = "projets"; return viewProjets(); }

  var tot = finTotal(p);
  var reste = finReste(p);
  var pct = num(p.cout) > 0 ? Math.min(100, Math.round(tot / num(p.cout) * 100)) : 0;

  /* --- AAP --- */
  var aap = projAap(p);
  var aapHtml;
  if (aap) {
    var dl = aap.deadline ? relLabel(aap.deadline) : null;
    aapHtml = '<div class="aap-box"><div class="aap-cols">'
      + '<div><p class="k">AAP</p><p class="v">' + esc(aap.nom || "Appel à projets") + '</p></div>'
      + '<div><p class="k">Date limite</p><p class="v">' + esc(formatDate(aap.deadline)) + (dl ? ' <span class="pill p-' + dl.tone + '">' + esc(dl.text) + '</span>' : "") + '</p></div>'
      + '<div><p class="k">Dotation</p><p class="v">' + esc(aap.montant || "—") + '</p></div>'
      + (aap.lien ? '<div><p class="k">Lien</p><p class="v"><a href="' + esc(aap.lien) + '" target="_blank" rel="noreferrer">Consulter l&#39;AAP</a></p></div>' : "")
      + '</div>'
      + '<div style="display:flex;gap:6px">'
      + (aap.deadline ? '<button class="btn sm" data-act="new-alert-deadline" data-org="' + org.id + '" data-projet="' + p.id + '">＋ Alerte deadline</button>' : "")
      + '<button class="btn sm" data-act="edit-aap" data-org="' + org.id + '" data-projet="' + p.id + '">✎ Éditer</button>'
      + '</div></div>';
  } else {
    aapHtml = '<p style="font-size:13px;color:#94a3b8;margin-top:8px">Aucun AAP identifié pour ce projet. <button class="org-link" style="background:none;border:0;padding:0;color:#047857;font-weight:600;text-decoration:underline" data-act="new-aap" data-org="' + org.id + '" data-projet="' + p.id + '">Ajouter un AAP</button></p>';
  }

  /* --- Financement --- */
  var lignes = (p.financement && p.financement.lignes) || [];
  var lignesHtml = lignes.length === 0
    ? '<p style="font-size:13px;color:#94a3b8;margin:6px 0 0">Aucune ligne de financement. Utilisez « ＋ Ligne de financement » pour décomposer le financement (fonds région, fonds propres, fonds mécène…).</p>'
    : '<table class="fin-table"><thead><tr><th>Source de financement</th><th class="num">Montant</th><th></th></tr></thead><tbody>'
      + lignes.map(function (l) {
          return '<tr><td><span contenteditable="true" data-live="ligne-src" data-org="' + org.id + '" data-projet="' + p.id + '" data-ligne="' + l.id + '" title="Cliquez pour modifier — enregistrement automatique" style="outline:none">' + esc(l.source || "—") + '</span>' + (l.orgId && findOrg(l.orgId) ? ' <span class="badge">' + esc(findOrg(l.orgId).nom) + '</span>' : "") + '</td><td class="num"><span contenteditable="true" data-live="ligne-mont" data-org="' + org.id + '" data-projet="' + p.id + '" data-ligne="' + l.id + '" title="Cliquez pour modifier le montant — enregistrement automatique" style="outline:none">' + fmtE(num(l.montant)) + '</span></td>'
            + '<td style="width:110px;text-align:right">'
            + '<button class="btn sm" data-act="edit-ligne" data-org="' + org.id + '" data-projet="' + p.id + '" data-id="' + l.id + '">✎</button> '
            + '<button class="btn sm danger" data-act="delete-ligne" data-org="' + org.id + '" data-projet="' + p.id + '" data-id="' + l.id + '">Suppr.</button></td></tr>';
        }).join("")
      + '</tbody></table>';

  /* --- Échanges liés au projet (porteur + co-financeurs) --- */
  var implOrgs = [org].concat((p.contributeurs || []).map(function (cid) { return findOrg(cid); }).filter(Boolean));
  var pjHisto = [];
  implOrgs.forEach(function (o2) {
    (o2.historique || []).forEach(function (h) {
      if (h.projetId === p.id) pjHisto.push(Object.assign({}, h, { orgId: o2.id, orgNom: o2.nom }));
    });
  });
  pjHisto.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var pjHistoHtml = pjHisto.length === 0
    ? '<p style="font-size:13px;color:#94a3b8;margin:8px 0">Aucun échange lié à ce projet pour le moment. Utilisez « ＋ Échange » pour tracer un rendez-vous, un mail, un appel…</p>'
    : pjHisto.map(function (h) {
        return '<div class="hist" style="cursor:pointer" data-act="edit-histo" data-org="' + h.orgId + '" data-id="' + h.id + '" title="Cliquer pour voir / modifier cet échange"><div style="flex:1">'
          + '<div class="head"><span class="d">' + esc(formatDate(h.date)) + '</span>'
          + '<span class="badge">' + esc(interactionInfo(h.type).label) + '</span>'
          + (h.contact ? '<span style="font-size:11.5px;color:#64748b">avec ' + esc(h.contact) + '</span>' : "")
          + (h.orgId !== org.id ? '<span class="badge b-sky">' + esc(h.orgNom) + '</span>' : "")
          + '</div><p class="txt">' + esc(h.resume) + '</p></div>'
          + '<div style="display:flex;gap:6px;align-items:center">'
          + '<button class="btn sm" data-act="edit-histo" data-org="' + h.orgId + '" data-id="' + h.id + '">✎</button>'
          + '<button class="btn sm danger" data-act="delete-histo" data-org="' + h.orgId + '" data-id="' + h.id + '">Suppr.</button>'
          + '</div></div>';
      }).join("");

  return '<div>'
    + '<div class="row between" style="margin-bottom:16px">'
    + '<button class="btn" data-act="open-org" data-id="' + org.id + '">← Retour à l&#39;établissement</button>'
    + '<button class="btn danger" data-act="delete-projet" data-org="' + org.id + '" data-id="' + p.id + '">Supprimer le projet</button>'
    + '</div>'
    + '<div class="card pad" style="padding:22px">'
    + '<div class="row between"><div><div class="row" style="gap:10px"><h2 style="margin:0;font-size:22px">' + esc(p.nom || "Projet") + '</h2>'
    + projStatutBadge(p.statut, org.id, p.id) + '</div>'
    + '<p style="margin:4px 0 0;font-size:13px;color:#64748b">🏢 <button class="org-link" style="background:none;border:0;padding:0;color:#047857;font-weight:600;text-decoration:underline" data-act="open-org" data-id="' + org.id + '">' + esc(org.nom) + '</button>' + (p.annee ? " · " + esc(p.annee) : "") + '</p></div>'
    + '<button class="btn primary" data-act="edit-projet" data-org="' + org.id + '" data-id="' + p.id + '">✎ Modifier le projet</button></div>'
    + '<div class="info-grid">'
    + '<div><p class="k">Coût total</p><p class="v">' + (num(p.cout) > 0 ? fmtE(num(p.cout)) : "—") + '</p></div>'
    + '<div><p class="k">Financé</p><p class="v" style="color:#047857;font-weight:600">' + fmtE(tot) + (num(p.cout) > 0 ? " (" + pct + " %)" : "") + '</p></div>'
    + '<div><p class="k">Reste à financer</p><p class="v" style="color:' + (reste > 0 ? "#be123c" : "#047857") + ';font-weight:600">' + fmtE(Math.max(0, reste)) + '</p></div>'
    + '</div>'
    + '<div class="note-box" style="padding:10px 12px;margin-top:14px">'
    + '<p style="margin:0 0 6px;font-size:12px;font-weight:600;color:#64748b">📝 Description du projet — cliquez ci-dessous pour écrire ou modifier, l&#39;enregistrement est automatique</p>'
    + '<div contenteditable="true" data-live="projet-desc" data-org="' + org.id + '" data-projet="' + p.id + '"' + (p.description ? '' : ' data-ph="1"') + ' style="min-height:30px;outline:none;white-space:pre-wrap;font-size:13.5px;line-height:1.55">' + (p.description ? esc(p.description) : '<span style="color:#94a3b8">Décrivez le projet, son avancement, ses prochaines étapes…</span>') + '</div>'
    + '</div>'
    + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Établissements impliqués</h3>'
    + '<button class="btn sm" data-act="new-contrib" data-org="' + org.id + '" data-id="' + p.id + '" title="Ajouter un établissement co-financeur">＋ Établissement</button></div>'
    + '<div class="list-row"><div style="min-width:0"><p class="t"><span class="badge b-emerald">🏢 Porteur</span> <button class="org-link" style="background:none;border:0;padding:0;color:#047857;font-weight:600;text-decoration:underline" data-act="open-org" data-id="' + org.id + '">' + esc(org.nom) + '</button></p>'
    + '<p class="s">' + statutBadge(org.statut, org.id) + ' ' + esc(orgTypeInfo(org.type).label) + (org.region ? " · " + esc(org.region) : "") + '</p>'
    + contactSummaryHtml(org)
    + '</div></div>'
    + ((p.contributeurs || []).length === 0
        ? '<p style="font-size:13px;color:#94a3b8;margin:8px 0">Aucun co-financeur pour le moment. Ajoutez un établissement partenaire avec « ＋ Établissement ».</p>'
        : (p.contributeurs || []).map(function (cid) {
            var co = findOrg(cid);
            if (!co) return "";
            return '<div class="list-row"><div style="min-width:0"><p class="t"><span class="badge b-sky">🤝 co-financement</span> <button class="org-link" style="background:none;border:0;padding:0;color:#047857;font-weight:600;text-decoration:underline" data-act="open-org" data-id="' + co.id + '">' + esc(co.nom) + '</button></p>'
              + '<p class="s">' + statutBadge(co.statut, co.id) + ' ' + esc(orgTypeInfo(co.type).label) + (co.region ? " · " + esc(co.region) : "") + '</p>'
              + contactSummaryHtml(co)
              + '</div>'
              + '<div style="display:flex;gap:6px">'
              + '<button class="btn sm" data-act="open-org" data-id="' + co.id + '">Fiche</button>'
              + '<button class="btn sm danger" data-act="remove-contrib" data-org="' + org.id + '" data-id="' + p.id + '" data-cid="' + co.id + '" title="Retirer cet établissement du projet">Retirer</button>'
              + '</div></div>';
          }).join(""))
    + '</div>'
    + '<div class="card pad" style="margin-top:20px"><div class="section-head"><h3>Financement</h3>'
    + '<button class="btn sm" data-act="new-ligne" data-org="' + org.id + '" data-projet="' + p.id + '">＋ Ligne de financement</button></div>'
    + lignesHtml
    + '<div class="fin-tot">'

function fld(label, inner) {
  return '<label class="fld"><span>' + label + '</span>' + inner + '</label>';
}

function statutOptions(selected) {
  var opts = state.statuts.map(function (s) {
    return '<option value="' + esc(s.value) + '"' + (selected === s.value ? " selected" : "") + '>' + esc(s.label) + '</option>';
  }).join("");
  var known = state.statuts.some(function (s) { return s.value === selected; });
  if (!known && selected) opts = '<option value="' + esc(selected) + '" selected>' + esc(selected) + '</option>' + opts;
  return opts;
}

      + fld("Poste", '<input id="m_mcposte" value="' + esc(mc0 ? mc0.poste || "" : "") + '" placeholder="Ex. Ingénieur études, menuisier…"/>')
