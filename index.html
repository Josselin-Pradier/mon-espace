<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#4f46e5"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Mon Espace"/>
<title>Mon Espace — Dossiers, Notes & Tâches</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--accent:#4f46e5;--accent-soft:#eef2ff;--danger:#dc2626;--ok:#059669;--warn:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:15px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical}
/* ---- Sidebar ---- */
.sidebar{width:228px;flex:0 0 228px;background:#111827;color:#cbd5e1;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:17px;color:#fff;padding:6px 10px 16px;letter-spacing:.3px}
.snav{display:block;padding:9px 10px;border-radius:8px;color:#cbd5e1;text-decoration:none;cursor:pointer;user-select:none}
.snav:hover{background:#1f2937;color:#fff}
.snav.active{background:var(--accent);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.side-note{font-size:11px;color:#6b7280;padding:10px 10px 0;line-height:1.5}
/* ---- Layout ---- */
.wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.navbtns{display:flex;gap:6px}
#gsearch{max-width:420px;margin-left:auto}
main{flex:1;padding:22px 24px;overflow-y:auto}
.content{max-width:1060px;margin:0 auto}
/* ---- Typo & head ---- */
.page-title{font-size:22px;font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:11px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{margin-bottom:10px}
.desc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;margin-bottom:16px;line-height:1.55}
h2.sec-title{font-size:15px;margin:22px 0 10px;color:#334155}
/* ---- Buttons ---- */
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 13px;color:var(--ink)}
.btn:hover{border-color:#94a3b8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:#fecaca}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.viewswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.viewswitch .btn{border:none;border-radius:0}
.viewswitch .btn.on{background:var(--accent);color:#fff}
/* ---- Bannières & KPI ---- */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:14px}
.banner.info{background:#eef2ff;border:1px solid #c7d2fe}
.banner.warn{background:#fffbeb;border:1px solid #fde68a}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .num{font-size:24px;font-weight:700}
.kpi .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.red .num{color:var(--danger)}
.kpi.blue .num{color:var(--accent)}
.kpi.amber .num{color:var(--warn)}
.kpi.green .num{color:var(--ok)}
/* ---- Cartes ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 14px rgba(30,41,59,.09)}
.card-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.card-title{font-weight:600;margin-bottom:6px}
.card-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.gray{background:#f1f5f9;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#475569;background:#f1f5f9;border-radius:20px;padding:3px 10px;cursor:pointer}
.chip:hover{background:#e2e8f0}
.eco{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#f1f5f9;color:var(--muted)}
.eco.late{background:#fee2e2;color:var(--danger)}
.eco.soon{background:#fef3c7;color:#92400e}
.eco.ok{background:#d1fae5;color:#065f46}
/* ---- Lignes (tâches) ---- */
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;flex-wrap:wrap}
.row-title{font-weight:500;cursor:pointer}
.row-title:hover{color:var(--accent)}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:1.5px solid #94a3b8;background:#fff;color:var(--ok);font-size:14px;line-height:1;padding:0}
.chk:hover{border-color:var(--accent)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);font-size:14px}
/* ---- Filtres ---- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:16px}
.filters input,.filters select{width:auto;min-width:150px}
.filters .grow{flex:1;min-width:180px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border:none;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600}
.tag:hover{background:#e0e7ff}
.tag.on{background:var(--accent);color:#fff}
.tags-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ---- Kanban ---- */
.kboard{display:flex;gap:12px;align-items:flex-start}
.kcol{flex:1;background:#eef0f6;border-radius:12px;padding:10px;min-height:120px}
.kcol h3{font-size:13px;color:#475569;margin:2px 4px 10px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:grab}
.kcard:active{cursor:grabbing}
.kcard .row-title{display:block;margin-bottom:6px}
.kcard .sub{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ---- Calendrier ---- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cal-title{font-weight:700;font-size:16px;flex:1;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal-cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:74px;padding:5px}
.cal-cell.other{background:transparent;border-color:transparent}
.cal-cell.today{border:1.5px solid var(--accent);background:var(--accent-soft)}
.cal-lbl{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
.cal-cell.today .cal-lbl{color:var(--accent)}
.cal-chip{display:block;font-size:10.5px;padding:2px 6px;border-radius:5px;margin-bottom:2px;cursor:pointer;background:#e0e7ff;color:#3730a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-chip.dos{background:#d1fae5;color:#065f46}
.cal-chip.pri-haute{background:#fef3c7;color:#92400e}
.cal-chip.pri-urgente{background:#fee2e2;color:#991b1b}
.cal-chip.fait{opacity:.45;text-decoration:line-through}
/* ---- Notes ---- */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.note-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.note-card:hover{box-shadow:0 4px 14px rgba(30,41,59,.09)}
.note-card .pin{float:right}
.note-extrait{font-size:13px;color:var(--muted);margin:6px 0 10px;line-height:1.5}
.note-view .content-pre{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;line-height:1.7;white-space:pre-wrap}
/* ---- Modales ---- */
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:520px;height:fit-content}
.modal h3{margin-bottom:14px;font-size:17px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.form-row.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.exp-grid .btn{padding:10px;text-align:left;line-height:1.4}
/* ---- Toast ---- */
#toast-root{position:fixed;bottom:22px;right:22px;z-index:60}
.toast{background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,.25)}
/* ---- Documents & capture (v2) ---- */
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.doc-card:hover{box-shadow:0 4px 14px rgba(30,41,59,.09)}
.doc-path{font-size:11px;color:#475569;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:2px 6px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:6px;text-decoration:none}
.capbtn{background:#f59e0b;border-color:#f59e0b;color:#fff;font-weight:600}
.capbtn:hover{background:#d97706;border-color:#d97706}
.eco.s2{background:#ffedd5;color:#c2410c}
.eco.s7{background:#fef9c3;color:#854d0e}
input[type=checkbox]{width:auto}
input[type=file]{padding:5px;font-size:12px}
.kbd{font-size:11px;background:#f1f5f9;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
.note-img{max-width:240px;max-height:150px;border-radius:8px;border:1px solid var(--line);margin:10px 0;display:block;cursor:zoom-in}
.img-pick label{font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
/* ---- Outlook & guide ---- */
.ms-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ms-dot.on{background:#059669}
.ms-dot.off{background:#94a3b8}
.ms-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;flex-wrap:wrap}
.ms-row .who{font-size:12px;color:var(--muted)}
.ms-row .when{font-size:12px;color:var(--accent);font-weight:600}
.ms-row .preview{font-size:12px;color:var(--muted);flex-basis:100%;margin-top:-2px}
.step{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.step h3{font-size:15px;margin-bottom:8px}
.step ol{margin:0 0 8px 20px;line-height:1.7;font-size:14px}
.codeblk{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:8px;font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:8px 0;line-height:1.5}
/* ---- Responsive & print ---- */
@media (max-width:760px){
 body{flex-direction:column}
 .sidebar{width:100%;flex:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
 .brand{padding:4px 8px}
 .snav{display:inline-block;padding:6px 10px}
 .side-foot{margin:0;flex-direction:row;flex-wrap:wrap}
 .side-note{display:none}
 .kpi-grid{grid-template-columns:1fr 1fr}
 .kboard{flex-direction:column}
 .kcol{width:100%}
}
@media print{
 .sidebar,.topbar,.btn,.filters,.viewswitch{display:none !important}
 body{background:#fff}
 main{padding:0}
 .card,.row{box-shadow:none}
}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="brand">✨ Mon Espace</div>
  <nav>
    <a class="snav" id="sn-dash" data-act="go" data-page="dash">🏠 Accueil</a>
    <a class="snav" id="sn-dossiers" data-act="go" data-page="dossiers">📁 Dossiers</a>
    <a class="snav" id="sn-taches" data-act="go" data-page="taches">✅ Tâches</a>
    <a class="snav" id="sn-docs" data-act="go" data-page="docs">📄 Documents</a>
    <a class="snav" id="sn-capture" data-act="go" data-page="capture">⚡ Capture</a>
    <a class="snav" id="sn-notes" data-act="go" data-page="notes">📝 Notes</a>
    <a class="snav" id="sn-outlook" data-act="go" data-page="outlook">📧 Outlook</a>
  </nav>
  <div class="side-foot">
    <a class="snav" data-act="go" data-page="install">📱 Installer l’appli</a>
    <a class="snav" data-act="open-export">💾 Export &amp; sauvegarde</a>
    <a class="snav" data-act="open-help">❓ Aide &amp; confidentialité</a>
    <div class="side-note">100 % local : vos données restent sur cet appareil. La connexion Outlook est optionnelle et se limite à ce que vous y consultez.</div>
  </div>
</aside>
<div class="wrap">
  <header class="topbar">
    <div class="navbtns">
      <button class="btn ghost" id="btn-back" data-act="nav-back" title="Reculer">←</button>
      <button class="btn ghost" id="btn-fwd" data-act="nav-fwd" title="Avancer">→</button>
    </div>
    <button class="btn capbtn" data-act="quick-capture" title="Capturer une idée (raccourci : touche C)">⚡ Capturer</button>
    <input id="gsearch" type="search" placeholder="Rechercher partout… (dossiers, tâches, notes, documents)" autocomplete="off"/>
  </header>
  <main id="main"><div class="content muted">Chargement…</div></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<noscript>Cette application nécessite JavaScript.</noscript>
<script>
/* =====================================================
   Mon Espace — Dossiers, Notes & Tâches
   Fichier unique, vanilla JS, données 100% locales.
   Priorité de chargement : localStorage > données
   embarquées (export HTML) > données d'exemple.
   ===================================================== */

// ===== Clés & constantes =====
var STORE_KEY='gestion-dnt-v1';
var PREFS_KEY='gestion-dnt-prefs-v1';
var EMBED_KEY='__ESPACE_EMBEDDED_DATA__';
var VERSION=3;
var OPEN_TAG='<scr'+'ipt>';
var CLOSE_TAG='<'+'/scr'+'ipt>';

var DOS_STATUTS=[
 {k:'ouvert',l:'Ouvert',c:'#2563eb'},
 {k:'en-cours',l:'En cours',c:'#7c3aed'},
 {k:'attente',l:'En attente',c:'#d97706'},
 {k:'termine',l:'Terminé',c:'#059669'},
 {k:'archive',l:'Archivé',c:'#64748b'}
];
var TACHE_STATUTS=[
 {k:'a-faire',l:'À faire',c:'#64748b'},
 {k:'en-cours',l:'En cours',c:'#2563eb'},
 {k:'fait',l:'Fait',c:'#059669'}
];
var PRIORITES=[
 {k:'basse',l:'Basse',c:'#94a3b8'},
 {k:'normale',l:'Normale',c:'#0284c7'},
 {k:'haute',l:'Haute',c:'#d97706'},
 {k:'urgente',l:'Urgente',c:'#dc2626'}
];
var CONTEXTES=[
 {k:'perso',l:'Perso',c:'#059669'},
 {k:'pro',l:'Pro',c:'#2563eb'}
];
var DOC_TYPES=[
 {k:'word',l:'Word',c:'#2b579a'},
 {k:'excel',l:'Excel',c:'#217346'},
 {k:'ppt',l:'PowerPoint',c:'#d24726'},
 {k:'pdf',l:'PDF',c:'#dc2626'},
 {k:'lien',l:'Lien / web',c:'#0891b2'},
 {k:'image',l:'Image',c:'#7c3aed'},
 {k:'autre',l:'Autre',c:'#64748b'}
];
var DOC_ROLES=[
 {k:'livrable',l:'Livrable projet',c:'#2563eb'},
 {k:'base',l:'Base évolutive',c:'#7c3aed'},
 {k:'modele',l:'Modèle / gabarit',c:'#0891b2'},
 {k:'source',l:'Source (à piocher)',c:'#d97706'},
 {k:'reference',l:'Référence',c:'#64748b'}
];

// ===== État =====
var state={
  dossiers:[],taches:[],notes:[],docs:[],exemple:false,
  page:'dash',detailId:'',tacheVue:'liste',calY:0,calM:0,
  searchQ:'',_drag:'',_capImg:'',_noteImg:'',
  ms:{connected:false,nom:'',events:[],mails:[],err:'',busy:false,token:'',exp:0},
  filtres:{dos:{q:'',statut:'',ctx:''},ta:{q:'',statut:'',prio:'',ctx:''},no:{q:'',tag:'',ctx:'',tr:''},dc:{q:'',type:'',role:'',dos:''}}
};
var nav={stack:[],index:-1};

// ===== Helpers génériques =====
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function plusJours(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function daysUntil(ds){if(!ds)return null;var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);var t=new Date();var mid=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((d-mid)/86400000);}
function fmtDate(ds){if(!ds)return '—';var p=ds.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function relEch(ds,done,dl){var n=daysUntil(ds);if(n===null)return '';if(done)return dl||'Fait';if(n<0)return 'Retard '+(-n)+' j';if(n===0)return 'Aujourd’hui';if(n===1)return 'Demain';if(n<=7)return 'Dans '+n+' j';return fmtDate(ds);}
function echClass(ds,done){if(done)return 'ok';var n=daysUntil(ds);if(n===null)return '';if(n<0)return 'late';if(n<=2)return 's2';if(n<=7)return 's7';return '';}
function echLabel(ds,done,dl){if(!ds)return '';return '<span class="eco '+echClass(ds,done)+'">'+relEch(ds,done,dl)+'</span>';}
function infoOf(list,k){var i;for(i=0;i<list.length;i++){if(list[i].k===k)return list[i];}return list[0];}
function validK(list,k,def){var i;for(i=0;i<list.length;i++){if(list[i].k===k)return k;}return def;}
function findDossier(id){var i;for(i=0;i<state.dossiers.length;i++){if(state.dossiers[i].id===id)return state.dossiers[i];}return null;}
function findTache(id){var i;for(i=0;i<state.taches.length;i++){if(state.taches[i].id===id)return state.taches[i];}return null;}
function findNote(id){var i;for(i=0;i<state.notes.length;i++){if(state.notes[i].id===id)return state.notes[i];}return null;}
function findDoc(id){var i;for(i=0;i<state.docs.length;i++){if(state.docs[i].id===id)return state.docs[i];}return null;}
function docsOfDossier(did){return state.docs.filter(function(x){return x.dossiers.indexOf(did)>=0;});}
function docNotes(id){return state.notes.filter(function(n){return n.docId===id;});}
function stamp(){return today().replace(/-/g,'');}
function jourLong(){try{return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});}catch(e){return fmtDate(today());}}

// ===== Persistance =====
function save(){
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify({version:VERSION,exemple:state.exemple,dossiers:state.dossiers,taches:state.taches,notes:state.notes,docs:state.docs}));
  }catch(e){}
}
function getPrefs(){try{var r=localStorage.getItem(PREFS_KEY);return r?JSON.parse(r):{};}catch(e){return {};}}
function setPrefs(p){try{localStorage.setItem(PREFS_KEY,JSON.stringify(p));}catch(e){}}
function markSaved(){var p=getPrefs();p.lastExport=new Date().toISOString();setPrefs(p);}
function lastSavedLabel(){var p=getPrefs();if(!p.lastExport)return 'jamais';var d=new Date(p.lastExport);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function needBackup(){
  if(state.dossiers.length+state.taches.length+state.notes.length===0)return false;
  var p=getPrefs();
  if(!p.lastExport)return true;
  return (new Date()-new Date(p.lastExport))>7*86400000;
}

// ===== Migration / normalisation (évolution sans casse) =====
function normalize(src){
  var d=(src&&typeof src==='object')?src:{};
  var out={version:VERSION,exemple:!!d.exemple,dossiers:[],taches:[],notes:[],docs:[]};
  var i,x;
  if(d.dossiers){
    for(i=0;i<d.dossiers.length;i++){
      x=d.dossiers[i];if(!x||!x.id)continue;
      out.dossiers.push({id:String(x.id),nom:String(x.nom||'Sans titre'),statut:validK(DOS_STATUTS,x.statut,'ouvert'),contexte:validK(CONTEXTES,x.contexte,'perso'),categorie:String(x.categorie||''),echeance:String(x.echeance||''),description:String(x.description||''),cree:String(x.cree||today()),maj:String(x.maj||today())});
    }
  }
  if(d.taches){
    for(i=0;i<d.taches.length;i++){
      x=d.taches[i];if(!x||!x.id)continue;
      var st=x.statut;if(!st){st=(x.fait?'fait':'a-faire');}
      out.taches.push({id:String(x.id),titre:String(x.titre||'Sans titre'),statut:validK(TACHE_STATUTS,st,'a-faire'),priorite:validK(PRIORITES,x.priorite,'normale'),contexte:validK(CONTEXTES,x.contexte,'perso'),echeance:String(x.echeance||''),dossierId:String(x.dossierId||''),description:String(x.description||''),cree:String(x.cree||today()),maj:String(x.maj||today())});
    }
  }
  if(d.notes){
    for(i=0;i<d.notes.length;i++){
      x=d.notes[i];if(!x||!x.id)continue;
      var tags=[];
      if(Array.isArray(x.tags)){var j;for(j=0;j<x.tags.length;j++){if(x.tags[j])tags.push(String(x.tags[j]));}}
      else if(typeof x.tags==='string'&&x.tags){var parts=x.tags.split(',');for(var k=0;k<parts.length;k++){if(parts[k].trim())tags.push(parts[k].trim());}}
      out.notes.push({id:String(x.id),titre:String(x.titre||'Sans titre'),contenu:String(x.contenu||''),tags:tags,contexte:validK(CONTEXTES,x.contexte,'perso'),dossierId:String(x.dossierId||''),tacheId:String(x.tacheId||''),docId:String(x.docId||''),epinglee:!!x.epinglee,echeance:String(x.echeance||''),traitee:!!x.traitee,capture:!!x.capture,image:String(x.image||''),maj:String(x.maj||today())});
    }
  }
  if(d.docs){
    for(i=0;i<d.docs.length;i++){
      x=d.docs[i];if(!x||!x.id)continue;
      var dIds=[];
      if(Array.isArray(x.dossiers)){var w2;for(w2=0;w2<x.dossiers.length;w2++){if(x.dossiers[w2])dIds.push(String(x.dossiers[w2]));}}
      out.docs.push({id:String(x.id),nom:String(x.nom||'Sans nom'),type:validK(DOC_TYPES,x.type,'autre'),role:validK(DOC_ROLES,x.role,'livrable'),localisation:String(x.localisation||''),description:String(x.description||''),dossiers:dIds,cree:String(x.cree||today()),maj:String(x.maj||today())});
    }
  }
  return out;
}

function load(){
  var raw=null;
  try{raw=localStorage.getItem(STORE_KEY);}catch(e){}
  if(raw){try{return normalize(JSON.parse(raw));}catch(e){}}
  try{if(typeof window[EMBED_KEY]!=='undefined'&&window[EMBED_KEY]){return normalize(window[EMBED_KEY]);}}catch(e){}
  return normalize(seedData());
}

// ===== Navigation (pile Reculer/Avancer) =====
function navGo(page,detailId){
  state.page=page;state.detailId=detailId||'';
  var top=nav.stack[nav.index];
  if(!top||top.page!==state.page||top.detailId!==state.detailId){
    nav.stack=nav.stack.slice(0,nav.index+1);
    nav.stack.push({page:state.page,detailId:state.detailId});
    nav.index++;
  }
}
function navBack(){if(nav.index>0){nav.index--;state.page=nav.stack[nav.index].page;state.detailId=nav.stack[nav.index].detailId;}}
function navFwd(){if(nav.index<nav.stack.length-1){nav.index++;state.page=nav.stack[nav.index].page;state.detailId=nav.stack[nav.index].detailId;}}

// ===== Requêtes =====
function tachesOuvertes(){return state.taches.filter(function(t){return t.statut!=='fait';});}
function retards(){
  var t=tachesOuvertes().filter(function(t){return t.echeance&&daysUntil(t.echeance)<0;});
  t.sort(function(a,b){return a.echeance<b.echeance?-1:1;});
  return t;
}
function semaine(){return tachesOuvertes().filter(function(t){var n=daysUntil(t.echeance);return n!==null&&n>=0&&n<=7;}).sort(function(a,b){return a.echeance<b.echeance?-1:1;});}
function dossiersActifs(){return state.dossiers.filter(function(d){return d.statut!=='termine'&&d.statut!=='archive';});}
function dossierTaches(id){return state.taches.filter(function(t){return t.dossierId===id;});}
function dossierNotes(id){
  var tids={},i;var ts=dossierTaches(id);
  for(i=0;i<ts.length;i++){tids[ts[i].id]=1;}
  return state.notes.filter(function(n){return n.dossierId===id||(n.tacheId&&tids[n.tacheId]);});
}
function allTags(){
  var m={},i,j;
  for(i=0;i<state.notes.length;i++){var tg=state.notes[i].tags||[];for(j=0;j<tg.length;j++){m[tg[j]]=(m[tg[j]]||0)+1;}}
  return m;
}

  var main=document.getElementById('main');if(!main)return;
  var h='';
  if(state.page==='dash')h=pageDash();
  else if(state.page==='dossiers')h=pageDossiers();
  else if(state.page==='dossier')h=pageDossier(state.detailId);
  else if(state.page==='taches')h=pageTaches();
  else if(state.page==='notes')h=pageNotes();
  else if(state.page==='note')h=pageNote(state.detailId);
  else if(state.page==='docs')h=pageDocs();
  else if(state.page==='doc')h=pageDoc(state.detailId);
  else if(state.page==='capture')h=pageCapture();
  else if(state.page==='outlook')h=pageOutlook();
  else if(state.page==='install')h=pageInstall();
  else if(state.page==='search')h=pageSearch();
  else h=page404();
  main.innerHTML=h;
  updateSidebar();updateTopbar();
}

// ===== Ligne de tâche =====
function tacheRow(t){
  var d=findDossier(t.dossierId);
  var done=(t.statut==='fait');
  var h='<div class="row tache-row'+(done?' done':'')+'">'
   +'<button class="chk" title="Marquer fait / à faire" data-act="tache-toggle" data-id="'+t.id+'">'+(done?'✓':'')+'</button>'
   +'<span class="row-title" data-act="open-tache" data-id="'+t.id+'">'+esc(t.titre)+'</span>';
  if(!done&&t.statut!=='a-faire')h+=badgeTache(t.statut);
  if(!done)h+=badgePrio(t.priorite);
  h+=badgeCtx(t.contexte);
  if(d)h+='<span class="chip" data-act="open-dossier" data-id="'+d.id+'">📁 '+esc(d.nom)+'</span>';
  h+=echLabel(t.echeance,done);
  h+='</div>';
  return h;
}

function pageTaches(){
  var h='<div class="content"><div class="page-head"><h1 class="page-title">✅ Tâches</h1><div class="toolbar">'
   +'<div class="viewswitch">'
   +'<button class="btn sm'+(state.tacheVue==='liste'?' on':'')+'" data-act="tache-vue" data-vue="liste">Liste</button>'
   +'<button class="btn sm'+(state.tacheVue==='kanban'?' on':'')+'" data-act="tache-vue" data-vue="kanban">Kanban</button>'

   +'</div>'

   +'</div></div>';
  h+=filtersTaches();
  h+='<div id="page-body">'+tachesBody()+'</div></div>';
  return h;
}
function filtersTaches(){
  var f=state.filtres.ta;
  return '<div class="filters">'
   +'<input class="grow" data-inp="ta.q" placeholder="Rechercher une tâche…" value="'+esc(f.q)+'"/>'
   +'<select data-chg="ta.statut"><option value="">Tous statuts</option>'+optsHtml(TACHE_STATUTS,f.statut)+'</select>'
   +'<select data-chg="ta.prio"><option value="">Toutes priorités</option>'+optsHtml(PRIORITES,f.prio)+'</select>'
   +'<select data-chg="ta.ctx"><option value="">Perso + Pro</option>'+optsHtml(CONTEXTES,f.ctx)+'</select>'
   +'</div>';
}
function filterTaches(){
  var f=state.filtres.ta;
  var q=f.q.trim().toLowerCase();
  return state.taches.filter(function(t){
    if(f.statut&&t.statut!==f.statut)return false;
    if(f.prio&&t.priorite!==f.prio)return false;
    if(f.ctx&&t.contexte!==f.ctx)return false;
    if(q){
      var d=findDossier(t.dossierId);
      var hay=(t.titre+' '+t.description+' '+(d?d.nom:'')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}
function tachesBody(){
  if(state.tacheVue==='kanban')return tachesKanban();
  if(state.tacheVue==='cal')return tachesCal();
  return tachesListe();
}
function tachesListe(){
  var list=filterTaches();
  if(!list.length)return '<div class="empty">Aucune tâche ne correspond. <button class="btn sm" data-act="new-tache">Créer une tâche</button></div>';
  var rd=[],se=[],plus=[],sans=[],faites=[];
  var i;
  for(i=0;i<list.length;i++){
    var t=list[i];
    if(t.statut==='fait'){faites.push(t);continue;}
    var n=daysUntil(t.echeance);
    if(n===null)sans.push(t);
    else if(n<0)rd.push(t);
    else if(n<=7)se.push(t);
    else plus.push(t);
  }
  var cmp=function(a,b){var ea=a.echeance||'9999',eb=b.echeance||'9999';return ea<eb?-1:1;};
  rd.sort(cmp);se.sort(cmp);plus.sort(cmp);
  faites.sort(function(a,b){return a.maj>b.maj?-1:1;});
  var h='';
  if(rd.length){h+='<h2 class="sec-title">🚨 En retard ('+rd.length+')</h2>';var a;for(a=0;a<rd.length;a++){h+=tacheRow(rd[a]);}}
  if(se.length){h+='<h2 class="sec-title">📅 Aujourd’hui &amp; 7 jours ('+se.length+')</h2>';var b;for(b=0;b<se.length;b++){h+=tacheRow(se[b]);}}
  if(plus.length){h+='<h2 class="sec-title">⏳ Plus tard ('+plus.length+')</h2>';var c;for(c=0;c<plus.length;c++){h+=tacheRow(plus[c]);}}
  if(sans.length){h+='<h2 class="sec-title">📋 Sans échéance ('+sans.length+')</h2>';var d;for(d=0;d<sans.length;d++){h+=tacheRow(sans[d]);}}
  if(faites.length){
    h+='<h2 class="sec-title">✓ Terminées ('+faites.length+')</h2>';
    var e;for(e=0;e<Math.min(faites.length,10);e++){h+=tacheRow(faites[e]);}
  }
  return h;
}
function tachesKanban(){
  var list=filterTaches();
  var h='<div class="kboard">';
  var i,j;
  for(i=0;i<TACHE_STATUTS.length;i++){
    var st=TACHE_STATUTS[i];
    var col=list.filter(function(t){return t.statut===st.k;});
    col.sort(function(a,b){var ea=a.echeance||'9999',eb=b.echeance||'9999';return ea<eb?-1:1;});
    h+='<div class="kcol" data-statut="'+st.k+'"><h3><span>'+st.l+'</span><span>'+col.length+'</span></h3>';

}
function kcard(t){
  var d=findDossier(t.dossierId);
  var h='<div class="kcard" draggable="true" data-id="'+t.id+'">'
   +'<span class="row-title" data-act="open-tache" data-id="'+t.id+'">'+esc(t.titre)+'</span>'
   +'<div class="sub">'+badgePrio(t.priorite)+badgeCtx(t.contexte);

var MOIS_NOMS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function tachesCal(){
  var y=state.calY,m=state.calM;
  if(!y){var nd=new Date();y=nd.getFullYear();m=nd.getMonth();state.calY=y;state.calM=m;}
  var h='<div class="cal-head">'
   +'<button class="btn ghost sm" data-act="cal-prev" title="Mois précédent">‹</button>'
   +'<div class="cal-title">'+MOIS_NOMS[m]+' '+y+'</div>'
   +'<button class="btn ghost sm" data-act="cal-next" title="Mois suivant">›</button>'
   +'<button class="btn sm" data-act="cal-today">Aujourd’hui</button></div>';
  h+='<div class="cal-grid">';
  var dows=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];var i;
  for(i=0;i<7;i++){h+='<div class="cal-dow">'+dows[i]+'</div>';}
  var first=new Date(y,m,1);
  var start=(first.getDay()+6)%7;
  var dim=new Date(y,m+1,0).getDate();
  var prevDim=new Date(y,m,0).getDate();
  var t2=today();
  for(i=0;i<42;i++){
    var dn=i-start+1;
    if(dn<1){
      h+='<div class="cal-cell other"><div class="cal-lbl">'+(prevDim+dn)+'</div></div>';
    }else if(dn>dim){
      h+='<div class="cal-cell other"><div class="cal-lbl">'+(dn-dim)+'</div></div>';
    }else{
      var dstr=y+'-'+pad(m+1)+'-'+pad(dn);
      var cls='cal-cell'+(dstr===t2?' today':'');
      h+='<div class="'+cls+'"><div class="cal-lbl">'+dn+'</div>'+calChips(dstr)+'</div>';
    }
  }
  h+='</div>';
  h+='<p class="tiny muted" style="margin-top:10px">Cliquez sur un élément pour l’ouvrir. Les échéances de dossiers apparaissent en vert, les priorités hautes/urgentes en jaune/rouge.</p>';
  return h;
}
function calChips(dstr){
  var h='';var n=0,more=0;var i;
  for(i=0;i<state.taches.length;i++){
    var t=state.taches[i];
    if(t.echeance!==dstr)continue;
    n++;
    if(n<=3){
      h+='<span class="cal-chip pri-'+t.priorite+(t.statut==='fait'?' fait':'')+'" data-act="open-tache" data-id="'+t.id+'" title="'+esc(t.titre)+'">'+esc(t.titre)+'</span>';
    }else{more++;}
  }
  for(i=0;i<state.dossiers.length;i++){
    var d=state.dossiers[i];
    if(d.echeance!==dstr||d.statut==='termine'||d.statut==='archive')continue;
    n++;
    if(n<=3){h+='<span class="cal-chip dos" data-act="open-dossier" data-id="'+d.id+'" title="'+esc(d.nom)+'">📁 '+esc(d.nom)+'</span>';}
    else{more++;}
  }
  if(more>0)h+='<div class="tiny muted">+'+more+' autre(s)</div>';
  return h;
}

function pageNotes(){

function filtersNotes(){
  var f=state.filtres.no;
  var tags=allTags();var keys=[];var k;
  for(k in tags){if(tags.hasOwnProperty(k))keys.push(k);}
  keys.sort();
  var h='<div class="filters">'
   +'<input class="grow" data-inp="no.q" placeholder="Rechercher dans les notes…" value="'+esc(f.q)+'"/>'
   +'<select data-chg="no.tr"><option value="">Toutes</option><option value="todo"'+(f.tr==='todo'?' selected':'')+'>À traiter</option><option value="done"'+(f.tr==='done'?' selected':'')+'>Traitées</option></select>'
   +'<select data-chg="no.ctx"><option value="">Perso + Pro</option>'+optsHtml(CONTEXTES,f.ctx)+'</select>'
   +'</div>';
  if(keys.length||f.tag){
    h+='<div class="filters" style="padding:8px 12px"><span class="small muted">Tags :</span><div class="tags-row">';
    var i;
    for(i=0;i<keys.length;i++){
      h+='<button class="tag'+(f.tag===keys[i]?' on':'')+'" data-act="tag-filter" data-tag="'+esc(keys[i])+'">#'+esc(keys[i])+' ('+tags[keys[i]]+')</button>';
    }
    if(f.tag)h+='<button class="btn sm ghost" data-act="tag-clear">✕ retirer le filtre</button>';
    h+='</div></div>';
  }
  return h;
}
function notesBody(){
  var f=state.filtres.no;
  var q=f.q.trim().toLowerCase();
  var list=state.notes.filter(function(n){
    if(f.tr==='todo'&&n.traitee)return false;
    if(f.tr==='done'&&!n.traitee)return false;
    if(f.ctx&&n.contexte!==f.ctx)return false;
    if(f.tag){
      var has=false;var i;
      for(i=0;i<(n.tags||[]).length;i++){if(n.tags[i]===f.tag){has=true;break;}}
      if(!has)return false;
    }
    if(q){
      var hay=(n.titre+' '+n.contenu+' '+(n.tags||[]).join(' ')).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
  list.sort(function(a,b){
    if(a.epinglee!==b.epinglee)return a.epinglee?-1:1;
    return a.maj>b.maj?-1:1;
  });
  if(!list.length)return '<div class="empty">Aucune note ne correspond. <button class="btn sm" data-act="new-note">Créer une note</button></div>';
  var h='<div class="notes-grid">';var i;
  for(i=0;i<list.length;i++){h+=noteCard(list[i]);}
  h+='</div>';
  return h;
}
function noteCard(n){
  var d=findDossier(n.dossierId);

  var h='<div class="note-card" data-act="open-note" data-id="'+n.id+'">'
   +(n.epinglee?'<span class="pin">📌</span>':'')
   +'<div class="card-title">'+esc(n.titre)+'</div>'
   +'<div class="note-extrait">'+esc(ex)+'</div>'
   +'<div class="badges">'+badgeCtx(n.contexte)+(n.capture?'<span class="badge" style="background:#fffbeb;color:#b45309">⚡</span>':'')+(n.image?'<span class="badge" style="background:#f5f3ff;color:#6d28d9">🖼</span>':'')+(n.traitee?'<span class="badge" style="background:#d1fae5;color:#065f46">✓ traitée</span>':'')+echLabel(n.echeance,n.traitee,'Traitée');
  var i;var tg=n.tags||[];

// ===== Recherche globale =====
function pageSearch(){
  var q=state.searchQ.trim().toLowerCase();
  var h='<div class="content">';
  h+='<h1 class="page-title">🔎 Recherche : « '+esc(state.searchQ)+' »</h1>';
  if(q.length<2){
    h+='<div class="empty">Tapez au moins 2 caractères dans la barre de recherche en haut.</div></div>';
    return h;
  }
  var rd=[],rt=[],rn=[],rc=[],i;
  for(i=0;i<state.dossiers.length;i++){
    var d=state.dossiers[i];
    if((d.nom+' '+d.categorie+' '+d.description).toLowerCase().indexOf(q)>=0)rd.push(d);
  }
  for(i=0;i<state.docs.length;i++){
    var x=state.docs[i];
    if((x.nom+' '+x.localisation+' '+x.description).toLowerCase().indexOf(q)>=0)rc.push(x);
  }
  for(i=0;i<state.taches.length;i++){
    var t=state.taches[i];
    var dd=findDossier(t.dossierId);
    if((t.titre+' '+t.description+' '+(dd?dd.nom:'')).toLowerCase().indexOf(q)>=0)rt.push(t);
  }
  for(i=0;i<state.notes.length;i++){
    var n=state.notes[i];
    if((n.titre+' '+n.contenu+' '+(n.tags||[]).join(' ')).toLowerCase().indexOf(q)>=0)rn.push(n);
  }
  if(!rd.length&&!rc.length&&!rt.length&&!rn.length){
    h+='<div class="empty">Aucun résultat.</div></div>';
    return h;
  }
  if(rd.length){
    h+='<h2 class="sec-title">📁 Dossiers ('+rd.length+')</h2><div class="cards">';
    for(i=0;i<Math.min(rd.length,12);i++)h+=dossierCard(rd[i]);
    h+='</div>';
  }
  if(rc.length){
    h+='<h2 class="sec-title">📄 Documents ('+rc.length+')</h2><div class="doc-grid">';
    for(i=0;i<Math.min(rc.length,12);i++)h+=docCard(rc[i]);
    h+='</div>';
  }
  if(rt.length){
    h+='<h2 class="sec-title">✅ Tâches ('+rt.length+')</h2>';
    for(i=0;i<Math.min(rt.length,15);i++)h+=tacheRow(rt[i]);
  }
  if(rn.length){
    h+='<h2 class="sec-title">📝 Notes ('+rn.length+')</h2><div class="notes-grid">';
    for(i=0;i<Math.min(rn.length,12);i++)h+=noteCard(rn[i]);
    h+='</div>';
  }
  h+='</div>';
  return h;
}

var MS_TENANT='https://login.microsoftonline.com/common';
var MS_SCOPES='User.Read Mail.Read Calendars.ReadWrite offline_access';
var MS_VRF_KEY='espace-ms-vrf';
var MS_RT_KEY='espace-ms-rt';
function msHttps(){try{return (typeof location!=='undefined'&&location.protocol==='https:');}catch(e){return false;}}
function msClientId(){var p=getPrefs();return String(p.msClientId||'');}
function msSaveClientId(v){var p=getPrefs();p.msClientId=String(v||'').trim();setPrefs(p);}
function msRedirectUri(){try{return location.origin+(location.pathname||'/');}catch(e){return '';}}
function msSessionRt(){try{return sessionStorage.getItem(MS_RT_KEY)||'';}catch(e){return '';}}
function msSetRt(v){try{if(v){sessionStorage.setItem(MS_RT_KEY,v);}else{sessionStorage.removeItem(MS_RT_KEY);}}catch(e){}}
function msReset(){state.ms={connected:false,nom:'',events:[],mails:[],err:'',busy:false,token:'',exp:0};}
function msB64url(buf){
  var bytes=new Uint8Array(buf);var s='';var i;
  for(i=0;i<bytes.length;i++){s+=String.fromCharCode(bytes[i]);}
  var b;try{b=btoa(s);}catch(e){b=s;}
  return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function msRandomVrf(){
  var a=new Uint8Array(48);var i;
  try{crypto.getRandomValues(a);}catch(e){for(i=0;i<a.length;i++){a[i]=Math.floor(Math.random()*256);}}
  return msB64url(a);
}
function msPkceChallenge(vrf){
  return new Promise(function(resolve,reject){
    try{
      var enc=new TextEncoder();
      crypto.subtle.digest('SHA-256',enc.encode(vrf)).then(function(d){resolve(msB64url(d));},reject);
    }catch(e){reject(e);}
  });
}
function msQsParam(k){
  try{
    var u=new URL(location.href);
    return u.searchParams.get(k)||'';
  }catch(e){
    var m=String(location.search||'').match(new RegExp('[?&]'+k+'=([^&]+)'));
    return m?decodeURIComponent(m[1]):'';
  }
}
function msLogin(){
  if(!msHttps()){toast('Ouvrez l’appli depuis son adresse https pour vous connecter (voir 📱 Installer l’appli).');return;}
  var cid=msClientId();
  if(!cid){toast('Collez d’abord l’ID d’application Microsoft.');return;}
  var vrf=msRandomVrf();
  try{sessionStorage.setItem(MS_VRF_KEY,vrf);}catch(e){}
  msPkceChallenge(vrf).then(function(ch){
    var url=MS_TENANT+'/oauth2/v2.0/authorize?client_id='+encodeURIComponent(cid)
     +'&response_type=code&redirect_uri='+encodeURIComponent(msRedirectUri())
     +'&scope='+encodeURIComponent(MS_SCOPES)
     +'&code_challenge='+encodeURIComponent(ch)+'&code_challenge_method=S256';
    window.location.href=url;
  }).catch(function(){toast('Chiffrement indisponible — connexion impossible ici.');});
}
function msTokenReq(params){
  return fetch(MS_TENANT+'/oauth2/v2.0/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:params});
}
function msHandleRedirect(){
  try{
    if(!msHttps())return;
    var code=msQsParam('code');
    if(!code)return;
    try{history.replaceState(null,'',location.pathname||'/');}catch(e2){}
    var vrf='';
    try{vrf=sessionStorage.getItem(MS_VRF_KEY)||'';sessionStorage.removeItem(MS_VRF_KEY);}catch(e3){}
    var cid=msClientId();
    if(!cid||!vrf){state.ms.err='Connexion interrompue — ID d’application ou vérification manquante.';return;}
    var body='client_id='+encodeURIComponent(cid)+'&grant_type=authorization_code&code='+encodeURIComponent(code)
     +'&redirect_uri='+encodeURIComponent(msRedirectUri())+'&code_verifier='+encodeURIComponent(vrf)
     +'&scope='+encodeURIComponent(MS_SCOPES);
    state.ms.busy=true;
    msTokenReq(body).then(function(r){return r.json();}).then(function(d){
      state.ms.busy=false;
      if(d.refresh_token)msSetRt(d.refresh_token);
      if(d.access_token){msApplyToken(d.access_token,Number(d.expires_in)||3600);msLoadAll();}
      else{state.ms.err=String(d.error_description||d.error||'Erreur de connexion Microsoft.');}
      if(state.page==='outlook')render();
    }).catch(function(){state.ms.busy=false;state.ms.err='Impossible de joindre Microsoft — vérifiez votre connexion internet.';if(state.page==='outlook')render();});
  }catch(e){}
}
function msApplyToken(tok,expiresIn){
  state.ms.token=tok;
  state.ms.exp=Date.now()+((expiresIn&&expiresIn>0)?(expiresIn-120):3480)*1000;
}
function msRefresh(){
  var rt=msSessionRt();
  if(!rt)return Promise.reject(new Error('session'));
  var cid=msClientId();
  if(!cid)return Promise.reject(new Error('config'));
  var body='client_id='+encodeURIComponent(cid)+'&grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)+'&scope='+encodeURIComponent(MS_SCOPES);
  return msTokenReq(body).then(function(r){return r.json();}).then(function(d){
    if(d.refresh_token)msSetRt(d.refresh_token);
    if(d.access_token){msApplyToken(d.access_token,Number(d.expires_in)||3600);return d.access_token;}
    msSetRt('');
    throw new Error('expired');
  });
}
function msEnsureToken(){
  if(state.ms.token&&Date.now()<state.ms.exp-60000)return Promise.resolve(state.ms.token);
  return msRefresh();
}
function msGraphOnce(tok,path,method,body){
  var opt={method:method||'GET',headers:{'Authorization':'Bearer '+tok}};
  if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
  return fetch('https://graph.microsoft.com/v1.0'+path,opt);
}
function msGraph(path,method,body){
  return msEnsureToken().then(function(tok){
    return msGraphOnce(tok,path,method,body).then(function(r){
      if(r.status===401){return msRefresh().then(function(tok2){return msGraphOnce(tok2,path,method,body);});}
      return r;
    });
  });
}
function msFmtWhen(iso){
  try{
    if(!iso)return '';
    var d=new Date(iso);
    var h=pad(d.getHours())+':'+pad(d.getMinutes());
    return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+' · '+h;
  }catch(e){return String(iso||'');}
}
function msLoadAll(){
  if(typeof fetch!=='function'){state.ms.busy=false;return Promise.resolve();}
  state.ms.busy=true;state.ms.err='';
  var nowIso=today()+'T00:00:00';
  var endIso=plusJours(45)+'T00:00:00';
  var evPath='/me/calendarview?startdatetime='+encodeURIComponent(nowIso)+'&enddatetime='+encodeURIComponent(endIso)+'&$top=15&$orderby=start/dateTime&$select=subject,start,end,location';
  var mgPath='/me/messages?$top=10&$orderby=receivedDateTime desc&$filter='+encodeURIComponent('isRead eq false')+'&$select=subject,bodyPreview,from,receivedDateTime';
  return Promise.all([
    msGraph('/me?$select=displayName').then(function(r){return r.json();}),
    msGraph(evPath).then(function(r){return r.json();}),
    msGraph(mgPath).then(function(r){return r.json();})
  ]).then(function(res){
    state.ms.nom=(res[0]&&res[0].displayName)?String(res[0].displayName):'';
    state.ms.events=(res[1]&&Array.isArray(res[1].value))?res[1].value:[];
    state.ms.mails=(res[2]&&Array.isArray(res[2].value))?res[2].value:[];
    state.ms.connected=true;state.ms.busy=false;
    if(state.page==='outlook'||state.page==='dash')render();
  }).catch(function(){
    state.ms.busy=false;
    state.ms.err='Impossible de lire Outlook — vérifiez la connexion ou reconnectez-vous.';
    if(state.page==='outlook')render();
  });
}
function msBoot(){
  if(!msHttps()||!msSessionRt())return;
  state.ms.busy=true;
  msRefresh().then(function(){return msLoadAll();}).catch(function(){
    state.ms.busy=false;msSetRt('');
    state.ms.err='Session Outlook expirée — reconnectez-vous.';
    if(state.page==='outlook')render();
  });
}
function msEventRow(ev){
  var st=(ev&&ev.start&&ev.start.dateTime)?ev.start.dateTime:'';

'var C="espace-cache-v1";',
'self.addEventListener("install",function(e){self.skipWaiting();});',

'self.addEventListener("fetch",function(e){',
'  if(e.request.method!=="GET")return;',
'  e.respondWith(',
'    caches.open(C).then(function(c){',
'      return c.match(e.request).then(function(r){',
'        var f=fetch(e.request).then(function(resp){',
'          if(resp&&resp.ok&&new URL(e.request.url).protocol.indexOf("http")===0)c.put(e.request,resp.clone());',
'          return resp;',
'        }).catch(function(){return r||Response.error();});',
'        return r||f;',
'      });',
'    })',
'  );',
'});'
].join('\n');

// ===== Exports =====
function downloadText(name,content,mime){
  var blob=new Blob([content],{type:mime||'text/plain'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},500);
}
function csvEsc(v){
  v=String(v==null?'':v);
  if(/[;"\r\n]/.test(v)){return '"'+v.replace(/"/g,'""')+'"';}
  return v;
}
function toCSV(rows){
  var out='\ufeff';var i,j;
  for(i=0;i<rows.length;i++){
    var cells=[];
    for(j=0;j<rows[i].length;j++){cells.push(csvEsc(rows[i][j]));}
    out+=cells.join(';')+'\r\n';
  }
  return out;
}
function exportJson(){
  downloadText('espace-'+stamp()+'.json',JSON.stringify({app:'espace-perso-pro',version:VERSION,exporte:new Date().toISOString(),dossiers:state.dossiers,taches:state.taches,notes:state.notes,docs:state.docs}),'application/json');
  markSaved();toast('Export JSON téléchargé');
}
function exportCsvDossiers(){
  var rows=[['id','nom','statut','contexte','categorie','echeance','taches_faites','taches_total','notes','description']];
  var i;
  for(i=0;i<state.dossiers.length;i++){
    var d=state.dossiers[i];
    var ts=dossierTaches(d.id),f=0,j;
    for(j=0;j<ts.length;j++){if(ts[j].statut==='fait')f++;}
    rows.push([d.id,d.nom,d.statut,d.contexte,d.categorie,d.echeance,f,ts.length,dossierNotes(d.id).length,d.description]);
  }
  downloadText('espace-dossiers-'+stamp()+'.csv',toCSV(rows),'text/csv');
  markSaved();toast('Export CSV Dossiers téléchargé');
}
function exportCsvTaches(){
  var rows=[['id','titre','statut','priorite','contexte','echeance','dossier','description']];
  var i;
  for(i=0;i<state.taches.length;i++){
    var t=state.taches[i];
    var d=findDossier(t.dossierId);
    rows.push([t.id,t.titre,t.statut,t.priorite,t.contexte,t.echeance,d?d.nom:'',t.description]);
  }
  downloadText('espace-taches-'+stamp()+'.csv',toCSV(rows),'text/csv');
  markSaved();toast('Export CSV Tâches téléchargé');
}
function exportCsvNotes(){
  var rows=[['id','titre','tags','contexte','dossier','tache','modifiee','contenu']];
  var i;
  for(i=0;i<state.notes.length;i++){
    var n=state.notes[i];
    var d=findDossier(n.dossierId);
    var t=findTache(n.tacheId);
    rows.push([n.id,n.titre,(n.tags||[]).join(' | '),n.contexte,d?d.nom:'',t?t.titre:'',n.maj,n.contenu]);
  }
  downloadText('espace-notes-'+stamp()+'.csv',toCSV(rows),'text/csv');
  markSaved();toast('Export CSV Notes téléchargé');
}
function exportCsvDocs(){
  var rows=[['id','nom','type','role','localisation','dossiers','description']];
  var i;
  for(i=0;i<state.docs.length;i++){
    var x=state.docs[i];
    var dnames=[],j;
    for(j=0;j<x.dossiers.length;j++){var d=findDossier(x.dossiers[j]);if(d)dnames.push(d.nom);}
    rows.push([x.id,x.nom,x.type,x.role,x.localisation,dnames.join(' | '),x.description]);
  }
  downloadText('espace-documents-'+stamp()+'.csv',toCSV(rows),'text/csv');
  markSaved();toast('Export CSV Documents téléchargé');
}
function exportHtmlAll(){
  var data=JSON.stringify({app:'espace-perso-pro',version:VERSION,exporte:new Date().toISOString(),exemple:false,dossiers:state.dossiers,taches:state.taches,notes:state.notes,docs:state.docs}).replace(/<\//g,'<\\/');
  var pre=OPEN_TAG+'window.'+EMBED_KEY+'='+data+';'+CLOSE_TAG;
  var cl=document.documentElement.cloneNode(true);
  var m=cl.querySelector('#main');if(m)m.innerHTML='';
  var mr=cl.querySelector('#modal-root');if(mr)mr.innerHTML='';
  var tr=cl.querySelector('#toast-root');if(tr)tr.innerHTML='';
  var html=cl.outerHTML;
  html='<!doctype html>'+html.replace(OPEN_TAG,function(){return pre+OPEN_TAG;});
  downloadText('espace-'+stamp()+'.html',html,'text/html');
  markSaved();toast('Export HTML autonome téléchargé');
}
function importJson(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.dossiers)||!Array.isArray(d.taches)||!Array.isArray(d.notes))throw new Error('format');
      if(!confirm('Remplacer toutes les données actuelles par celles du fichier ?'))return;
      var st=normalize(d);
      state.dossiers=st.dossiers;state.taches=st.taches;state.notes=st.notes;state.exemple=false;
      save();closeModal();toast('Import réussi');render();
    }catch(e){alert('Fichier invalide ou illisible.');}
  };
  rd.readAsText(file);
}

// ===== Toast =====
function toast(msg){
  var r=document.getElementById('toast-root');if(!r)return;
  r.innerHTML='<div class="toast">'+msg+'</div>';
  setTimeout(function(){r.innerHTML='';},2400);
}

// ===== Formulaires =====
function saveDossierForm(f){
  var el=f.elements;
  var id=el.id.value;
  var d=id?findDossier(id):null;
  var nouveau=!d;
  if(!d){d={id:uid(),cree:today()};state.dossiers.push(d);}
  d.nom=el.n.value.trim()||'Sans titre';
  d.statut=el.st.value;
  d.contexte=el.ctx.value;
  d.categorie=el.cat.value.trim();
  d.echeance=el.ech.value;
  d.description=el.desc.value;
  d.maj=today();
  save();closeModal();toast('Dossier enregistré');
  if(nouveau){navGo('dossier',d.id);}
  render();
}
function saveTacheForm(f){
  var el=f.elements;
  var id=el.id.value;
  var t=id?findTache(id):null;
  if(!t){t={id:uid(),cree:today()};state.taches.push(t);}
  t.titre=el.tit.value.trim()||'Sans titre';
  t.statut=el.st.value;
  t.priorite=el.prio.value;
  t.contexte=el.ctx.value;
  t.echeance=el.ech.value;
  t.dossierId=el.dos.value;
  t.description=el.desc.value;
  t.maj=today();
  save();closeModal();toast('Tâche enregistrée');
  render();
}
function saveNoteForm(f){
  var el=f.elements;
  var id=el.id.value;
  var n=id?findNote(id):null;
  var nouveau=!n;
  if(!n){n={id:uid(),maj:today()};state.notes.push(n);}
  n.titre=el.tit.value.trim()||'Sans titre';
  n.contenu=el.cont.value;
  var raw=el.tags.value.split(',');
  var tags=[],i;
  for(i=0;i<raw.length;i++){var tg=raw[i].trim();if(tg)tags.push(tg);}
  n.tags=tags;
  n.contexte=el.ctx.value;
  n.epinglee=(el.pin.value==='oui');
  n.echeance=el.ech.value;
  n.traitee=(el.tr.value==='oui');
  n.dossierId=el.dos.value;
  n.tacheId=el.ta.value;
  n.docId=el.doc.value;
  if(state._noteImg){n.image=state._noteImg;state._noteImg='';}
  n.maj=today();
  save();closeModal();toast('Note enregistrée');
  if(nouveau){navGo('note',n.id);}
  render();
}
function saveDocForm(f){
  var el=f.elements;
  var id=el.id.value;
  var x=id?findDoc(id):null;
  var nouveau=!x;
  if(!x){x={id:uid(),cree:today()};state.docs.push(x);}
  x.nom=el.n.value.trim()||'Sans nom';
  x.type=el.ty.value;
  x.role=el.ro.value;
  x.localisation=el.loc.value.trim();
  x.description=el.desc.value;
  var ids=[],i;
  if(el.dos){
    if(el.dos.length){
      for(i=0;i<el.dos.length;i++){if(el.dos[i].checked)ids.push(el.dos[i].value);}
    }else if(el.dos.checked){ids.push(el.dos.value);}
  }
  x.dossiers=ids;
  x.maj=today();
  save();closeModal();toast('Document enregistré');
  if(nouveau){navGo('doc',x.id);}
  render();
}
function saveCaptureForm(f){
  var el=f.elements;
  var n={id:uid(),titre:el.tit.value.trim()||'Idée',contenu:'',tags:[],contexte:'perso',dossierId:el.dos.value,tacheId:'',docId:'',epinglee:false,echeance:el.ech.value,traitee:false,capture:true,image:state._capImg||'',maj:today()};
  state.notes.push(n);
  state._capImg='';
  save();closeModal();toast('Idée capturée ⚡');
  render();
}
function readImage(file,dest){
  var rd=new FileReader();
  rd.onload=function(){
    var s=String(rd.result);
    if(s.length>1500000){alert('Image trop lourde (plus d’1 Mo après conversion) — recadrez-la ou compressez-la avant.');return;}
    if(dest==='cap'){
      state._capImg=s;
      var info=document.getElementById('cap-img-info');
      if(info)info.innerHTML='🖼 Image jointe ('+Math.round(s.length/1365)+' Ko)';
    }else{
      state._noteImg=s;
      var info2=document.getElementById('note-img-info');
      if(info2)info2.innerHTML='🖼 Image jointe ('+Math.round(s.length/1365)+' Ko)';
    }
  };
  rd.readAsDataURL(file);
}

// ===== Écouteurs globaux =====
document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.classList&&ev.target.classList.contains('modal-back')){closeModal();return;}
  if(ev.target.closest&&ev.target.closest('a[href]'))return;
  var el=ev.target.closest('[data-act]');
  if(!el)return;
  ev.preventDefault();
  var a=el.getAttribute('data-act');
  var id=el.getAttribute('data-id');
  if(a==='go'){navGo(el.getAttribute('data-page'),'');render();}
  else if(a==='nav-back'){navBack();render();}
  else if(a==='nav-fwd'){navFwd();render();}
  else if(a==='open-dossier'){navGo('dossier',id);render();}
  else if(a==='open-tache'){modalTache(id,'');}
  else if(a==='open-note'){navGo('note',id);render();}
  else if(a==='new-tache'){modalTache('',el.getAttribute('data-dos')||'');}
  else if(a==='new-dossier'){modalDossier('');}
  else if(a==='new-note'){modalNote('',el.getAttribute('data-dos')||'',el.getAttribute('data-doc')||'');}
  else if(a==='edit-dossier'){modalDossier(id);}
  else if(a==='edit-note'){modalNote(id,'');}
  else if(a==='tache-toggle'){
    var t=findTache(id);if(t){t.statut=(t.statut==='fait')?'a-faire':'fait';t.maj=today();save();render();}
  }
  else if(a==='del-dossier'){
    var d=findDossier(id);
    if(d&&confirm('Supprimer le dossier « '+d.nom+' » ?\nSes tâches et notes seront conservées mais détachées.')){
      var i;
      for(i=0;i<state.taches.length;i++){if(state.taches[i].dossierId===id)state.taches[i].dossierId='';}
      for(i=0;i<state.notes.length;i++){if(state.notes[i].dossierId===id)state.notes[i].dossierId='';}
      state.dossiers=state.dossiers.filter(function(x){return x.id!==id;});
      if(state.page==='dossier'&&state.detailId===id){navGo('dossiers','');}
      save();toast('Dossier supprimé');render();
    }
  }
  else if(a==='del-tache'){
    var t2=findTache(id);
    if(t2&&confirm('Supprimer la tâche « '+t2.titre+' » ?')){
      var j;
      for(j=0;j<state.notes.length;j++){if(state.notes[j].tacheId===id)state.notes[j].tacheId='';}
      state.taches=state.taches.filter(function(x){return x.id!==id;});
      save();closeModal();toast('Tâche supprimée');render();
    }
  }
  else if(a==='del-note'){
    var n=findNote(id);
    if(n&&confirm('Supprimer la note « '+n.titre+' » ?')){
      state.notes=state.notes.filter(function(x){return x.id!==id;});
      if(state.page==='note'&&state.detailId===id){navGo('notes','');}
      save();toast('Note supprimée');render();
    }
  }
  else if(a==='pin-note'){var n2=findNote(id);if(n2){n2.epinglee=!n2.epinglee;save();render();}}
  else if(a==='open-export'){modalExport();}
  else if(a==='open-help'){modalHelp();}
  else if(a==='modal-close'){closeModal();}
  else if(a==='tache-vue'){state.tacheVue=el.getAttribute('data-vue');render();}
  else if(a==='cal-prev'){
    state.calM--;if(state.calM<0){state.calM=11;state.calY--;}
    renderPageBody();
  }
  else if(a==='cal-next'){
    state.calM++;if(state.calM>11){state.calM=0;state.calY++;}
    renderPageBody();
  }
  else if(a==='cal-today'){var nd=new Date();state.calY=nd.getFullYear();state.calM=nd.getMonth();renderPageBody();}
  else if(a==='clear-exemple'){
    if(confirm('Effacer toutes les données d’exemple ?')){
      state.dossiers=[];state.taches=[];state.notes=[];state.docs=[];state.exemple=false;
      save();toast('Données d’exemple effacées');render();
    }
  }
  else if(a==='backup-ok'){markSaved();toast('Sauvegarde marquée comme faite');render();}
  else if(a==='export-json'){exportJson();}
  else if(a==='export-html'){exportHtmlAll();}
  else if(a==='export-csv-dos'){exportCsvDossiers();}
  else if(a==='export-csv-ta'){exportCsvTaches();}
  else if(a==='export-csv-no'){exportCsvNotes();}
  else if(a==='tag-filter'){
    var tg2=el.getAttribute('data-tag');
    state.filtres.no.tag=(state.filtres.no.tag===tg2)?'':tg2;
    render();
  }
  else if(a==='tag-clear'){state.filtres.no.tag='';render();}
  else if(a==='open-doc'){navGo('doc',id);render();}
  else if(a==='new-doc'){modalDoc('',el.getAttribute('data-dos')||'');}
  else if(a==='edit-doc'){modalDoc(id,'');}
  else if(a==='link-doc'){modalLinkDoc(id);}
  else if(a==='doc-tgl-dos'){
    var x2=findDoc(id);var did2=el.getAttribute('data-dos');
    if(x2&&did2){
      var ix=x2.dossiers.indexOf(did2);
      if(ix>=0){x2.dossiers.splice(ix,1);}
      else{x2.dossiers.push(did2);}
      x2.maj=today();save();modalLinkDoc(did2);render();
    }
  }
  else if(a==='del-doc'){
    var x3=findDoc(id);
    if(x3&&confirm('Supprimer le document « '+x3.nom+' » ?\nSes notes seront conservées mais détachées.')){
      var i3;
      for(i3=0;i3<state.notes.length;i3++){if(state.notes[i3].docId===id)state.notes[i3].docId='';}
      state.docs=state.docs.filter(function(y){return y.id!==id;});
      if(state.page==='doc'&&state.detailId===id){navGo('docs','');}
      save();toast('Document supprimé');render();
    }
  }
  else if(a==='quick-capture'){modalCapture();}
  else if(a==='note-traitee'){
    var n3=findNote(id);if(n3){n3.traitee=!n3.traitee;save();render();}
  }
  else if(a==='note-delimg'){
    var n4=findNote(id);if(n4){n4.image='';save();modalNote(id,'','');render();}
  }
  else if(a==='img-view'){
    var src=el.getAttribute('src');
    if(src)openModal('<div style="text-align:center"><img src="'+esc(src)+'" style="max-width:100%;border-radius:10px"/></div><div class="modal-foot"><button class="btn ghost" data-act="modal-close">Fermer</button></div>');
  }
  else if(a==='ms-saveclient'){
    var inp=document.getElementById('ms-client');
    if(inp){msSaveClientId(inp.value);toast('ID d’application enregistré — vous pouvez vous connecter');render();}
  }
  else if(a==='ms-login'){msLogin();}
  else if(a==='ms-logout'){msSetRt('');msReset();toast('Déconnecté d’Outlook');render();}
  else if(a==='ms-refresh'){
    if(state.ms.connected||msSessionRt()){state.ms.busy=true;render();msLoadAll();}
    else{toast('Connectez-vous d’abord.');}
  }
  else if(a==='mail-to-note'){msMailToNote(id);}
  else if(a==='note-to-outlook'){msNoteToOutlook(id);}
});
document.addEventListener('submit',function(ev){
  var f=ev.target;
  if(!f||!f.id)return;
  if(f.id==='f-dossier'){ev.preventDefault();saveDossierForm(f);}
  else if(f.id==='f-tache'){ev.preventDefault();saveTacheForm(f);}
  else if(f.id==='f-note'){ev.preventDefault();saveNoteForm(f);}
  else if(f.id==='f-doc'){ev.preventDefault();saveDocForm(f);}
  else if(f.id==='f-capture'){ev.preventDefault();saveCaptureForm(f);}
});
function setFilter(key,val){
  var parts=key.split('.');
  if(parts.length===2&&state.filtres[parts[0]]){state.filtres[parts[0]][parts[1]]=val;}
}
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(!el||!el.getAttribute)return;
  if(el.id==='gsearch'){
    state.searchQ=el.value;
    if(el.value.trim().length>=2){if(state.page!=='search')navGo('search','');render();}
    else if(state.page==='search'){navGo('dash','');render();}
    return;
  }
  var k=el.getAttribute('data-inp');
  if(!k)return;
  setFilter(k,el.value);
  renderPageBody();
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(!el||!el.getAttribute)return;
  if(el.id==='imp-json'){if(el.files&&el.files[0])importJson(el.files[0]);return;}
  if(el.id==='cap-img'){if(el.files&&el.files[0])readImage(el.files[0],'cap');return;}
  if(el.id==='note-img'){if(el.files&&el.files[0])readImage(el.files[0],'note');return;}
  var k=el.getAttribute('data-chg');
  if(!k)return;
  setFilter(k,el.value);
  renderPageBody();
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'){closeModal();return;}
  if(ev.ctrlKey&&ev.key==='Enter'){
    var f=null;
    try{f=document.querySelector('.modal form');}catch(e){}
    if(f){
      if(typeof f.requestSubmit==='function'){f.requestSubmit();}
      else if(f.dispatchEvent){f.dispatchEvent(new Event('submit',{cancelable:true}));}
    }
    return;
  }
  if(ev.ctrlKey||ev.altKey||ev.metaKey)return;
  var tag=(ev.target&&ev.target.tagName)?String(ev.target.tagName).toLowerCase():'';
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(ev.target&&ev.target.isContentEditable)return;
  if(ev.key==='c'||ev.key==='C'){modalCapture();}
  else if(ev.key==='/'){var g=document.getElementById('gsearch');if(g&&g.focus){ev.preventDefault();g.focus();}}
});
document.addEventListener('paste',function(ev){
  var inCap=false;
  try{inCap=!!document.querySelector('#f-capture');}catch(e){}
  if(!inCap)return;
  var items=(ev.clipboardData&&ev.clipboardData.items)?ev.clipboardData.items:[];
  var i;
  for(i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      var blob=items[i].getAsFile();
      if(!blob)continue;
      var rd=new FileReader();
      rd.onload=function(){
        var s=String(rd.result);
        if(s.length>1500000){alert('Image trop lourde (plus d’1 Mo) — recadrez-la ou compressez-la avant.');return;}
        state._capImg=s;
        var info=document.getElementById('cap-img-info');
        if(info)info.innerHTML='🖼 Image jointe ('+Math.round(s.length/1365)+' Ko)';
      };
      rd.readAsDataURL(blob);
      ev.preventDefault();
      break;
    }
  }
});
// Kanban : glisser-déposer
document.addEventListener('dragstart',function(ev){
  var c=ev.target.closest?ev.target.closest('.kcard'):null;
  if(!c)return;
  state._drag=c.getAttribute('data-id');
  try{ev.dataTransfer.setData('text/plain',state._drag);ev.dataTransfer.effectAllowed='move';}catch(e){}
});
document.addEventListener('dragover',function(ev){
  var c=ev.target.closest?ev.target.closest('.kcol'):null;
  if(c){ev.preventDefault();}
});
document.addEventListener('drop',function(ev){
  var c=ev.target.closest?ev.target.closest('.kcol'):null;
  if(!c)return;
  ev.preventDefault();
  var id=state._drag;
  try{var dt=ev.dataTransfer.getData('text/plain');if(dt)id=dt;}catch(e){}
  var t=findTache(id);
  if(t){t.statut=c.getAttribute('data-statut');t.maj=today();save();}
  state._drag='';
  render();
});

  state.notes=st.notes;
  state.docs=st.docs;
  state.exemple=st.exemple;
  navGo('dash','');
  render();
  msBoot();
}
init();
